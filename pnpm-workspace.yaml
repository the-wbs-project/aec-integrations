packages:
  - 'apps/*'
  - 'packages/*'

# Allow better-sqlite3 (apps/api dev dep) to run its native build script — it
# backs the in-memory D1 test harness (apps/api/src/test/d1.ts, ADR 0016 /
# AECI-253). pnpm 10 blocks all build scripts by default; this opts in the one
# we need (CI runs `pnpm install` and builds it too).
onlyBuiltDependencies:
  - better-sqlite3

# @flue/runtime@2.1.0 (apps/agent) pins hono to exactly 4.12.32, which misses
# the v4.13.16 security fixes (mount prefix, RegExpRouter wildcard middleware,
# validator('form'), css, csrf). Flue 2.2+ declares ^4.12.32; drop this
# override when apps/agent moves to it.
overrides:
  '@flue/runtime>hono': 4.13.16
