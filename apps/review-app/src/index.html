<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AEC Integrations Review</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon-i.svg">
  <link rel="icon" type="image/x-icon" href="/favicon-i.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.syncfusion.com/ej2/33.2.3/tailwind.css" rel="stylesheet">
  <script>
    // Pre-hydration theme application — avoids FOUC. Angular's ThemeService
    // takes over after bootstrap and listens for live OS changes.
    (function () {
      var stored;
      try { stored = localStorage.getItem('review-app:theme'); } catch (e) { stored = null; }
      var resolved;
      if (stored === 'light' || stored === 'dark') {
        resolved = stored;
      } else {
        resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
