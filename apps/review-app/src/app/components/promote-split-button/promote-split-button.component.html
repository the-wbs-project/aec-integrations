@switch (view()) {
  @case ('promote') {
    <ejs-splitbutton
      content="Promote"
      [items]="promoteMenuItems"
      [disabled]="disabled()"
      cssClass="e-primary promote-btn"
      (click)="promote()"
      (select)="onMenuSelect($event)"
    ></ejs-splitbutton>
  }
  @case ('promoted') {
    <ejs-splitbutton
      content="Promoted ✓"
      [items]="promotedMenuItems"
      [disabled]="disabled()"
      cssClass="e-success promote-btn promote-btn--promoted"
      (select)="onMenuSelect($event)"
    ></ejs-splitbutton>
  }
  @case ('retracted') {
    <ejs-splitbutton
      content="Retracted"
      [items]="retractedMenuItems"
      [disabled]="disabled()"
      cssClass="promote-btn promote-btn--retracted"
      (select)="onMenuSelect($event)"
    ></ejs-splitbutton>
  }
  @case ('rejected') {
    <ejs-splitbutton
      content="Rejected"
      [items]="rejectedMenuItems"
      [disabled]="disabled()"
      cssClass="promote-btn promote-btn--rejected"
      (select)="onMenuSelect($event)"
    ></ejs-splitbutton>
  }
}
