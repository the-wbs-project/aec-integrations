<ejs-dialog
  [visible]="open()"
  [isModal]="true"
  [closeOnEscape]="!saving()"
  [showCloseIcon]="!saving()"
  header="New vendor"
  width="480px"
  target="body"
  cssClass="new-vendor-dialog"
  (close)="onClose()"
>
  <ng-template #content>
    <form class="new-vendor" (ngSubmit)="submit()" novalidate>
      <p class="new-vendor__intro">
        Enter the basics — we'll create the record and start research right
        away. You'll land on the vendor page while it runs.
      </p>

      <div class="form-row">
        <label class="field-label" for="new-vendor-name">
          Company name <span class="required">*</span>
        </label>
        <input
          id="new-vendor-name"
          class="input"
          name="companyName"
          [ngModel]="companyName()"
          (ngModelChange)="companyName.set($event)"
          [disabled]="saving()"
          autocomplete="off"
          required
        />
      </div>

      <div class="form-row">
        <label class="field-label" for="new-vendor-website">Website</label>
        <input
          id="new-vendor-website"
          class="input"
          name="website"
          type="url"
          [ngModel]="website()"
          (ngModelChange)="website.set($event)"
          [disabled]="saving()"
          placeholder="https://example.com"
          autocomplete="off"
        />
      </div>

      @if (errorMsg(); as msg) {
        <p class="form-error" role="alert">{{ msg }}</p>
      }

      <div class="form-actions">
        <button
          type="submit"
          class="btn btn--primary"
          [disabled]="saving() || !companyName().trim()"
        >
          {{ saving() ? 'Creating…' : 'Create & research' }}
        </button>
        <button
          type="button"
          class="btn btn--ghost"
          [disabled]="saving()"
          (click)="onClose()"
        >
          Cancel
        </button>
      </div>
    </form>
  </ng-template>
</ejs-dialog>
