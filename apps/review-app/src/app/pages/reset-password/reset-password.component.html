<div class="login-shell">
  <div class="login-card">
    <h1 class="login-heading">Choose a new password</h1>

    @if (success()) {
      <p class="muted intro">
        Password updated. Redirecting you now…
      </p>
    } @else {
      <p class="muted intro">
        Pick a new password for your account. You'll be signed in once it's set.
      </p>

      <form (ngSubmit)="submit()" #form="ngForm" novalidate>
        <div class="form-row">
          <label class="field-label" for="reset-password">New password</label>
          <input
            id="reset-password"
            class="input"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            autofocus
            required
            minlength="8"
          />
        </div>

        <div class="form-row">
          <label class="field-label" for="reset-confirm">Confirm password</label>
          <input
            id="reset-confirm"
            class="input"
            name="confirm"
            type="password"
            [(ngModel)]="confirm"
            autocomplete="new-password"
            required
            minlength="8"
          />
        </div>

        @if (error()) {
          <p class="form-error" role="alert">{{ error() }}</p>
        }

        <div class="form-actions">
          <button
            type="submit"
            class="btn btn--primary"
            [disabled]="submitting() || !password() || !confirm()"
          >
            {{ submitting() ? 'Updating…' : 'Update password' }}
          </button>
        </div>
      </form>

      <p class="muted alt-link">
        <a routerLink="/login">Back to sign in</a>
      </p>
    }
  </div>
</div>
