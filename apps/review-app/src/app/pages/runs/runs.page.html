<div class="page-container--wide">
  <div class="page-header">
    <h1 class="page-heading">Workflow runs</h1>
  </div>

  <ejs-grid
    [dataSource]="rows()"
    [allowPaging]="true"
    [pageSettings]="{ pageSize: 25 }"
    [allowSorting]="true"
    [allowFiltering]="true"
    [filterSettings]="{ type: 'Excel' }"
    height="560"
    (rowSelected)="onRowSelected($event)"
  >
    <e-columns>
      <e-column field="workflowTitle" headerText="Workflow" width="220"></e-column>
      <e-column field="recordLabel" headerText="Record" width="220"></e-column>
      <e-column field="status" headerText="Status" width="120">
        <ng-template #template let-data>
          <span class="status-pill" [attr.data-status]="data.status" [attr.data-confidence]="data.confidence ?? null">{{ data.status }}{{ data.status === 'complete' && data.confidence === 'low' ? ' (low)' : '' }}</span>
        </ng-template>
      </e-column>
      <e-column field="startedAt" headerText="Started" width="180" type="dateTime" format="MMM d, y, h:mm a"></e-column>
      <e-column field="runId" headerText="Run ID" width="280" [isPrimaryKey]="true"></e-column>
    </e-columns>
  </ejs-grid>

  <app-run-detail-dialog [run]="selectedRun()" (closed)="onDialogClosed()" />
</div>
