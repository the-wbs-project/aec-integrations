<header class="shell-header" [class.shell-header--scrolled]="scrolled()">
  <div class="shell-header__inner">
    <a routerLink="/" class="shell-header__brand" aria-label="AEC Integrations Review">
      <span class="shell-header__brand-mark" aria-hidden="true"></span>
      <span class="shell-header__brand-text">
        <span class="shell-header__brand-name">AEC Integrations</span>
        <span class="shell-header__brand-tag">Review</span>
      </span>
    </a>
    <nav class="nav" aria-label="Main navigation">
      <a class="nav__item" routerLink="/" routerLinkActive="nav__item--active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
      <a class="nav__item" routerLink="/products" routerLinkActive="nav__item--active">Products</a>
      <a class="nav__item" routerLink="/vendors" routerLinkActive="nav__item--active">Vendors</a>
      <a class="nav__item" routerLink="/runs" routerLinkActive="nav__item--active">Runs</a>
      <a class="nav__item" routerLink="/prompts" routerLinkActive="nav__item--active">Prompts</a>
    </nav>
    <div class="shell-header__actions">
      <app-model-selector />
      <app-notifications-bell />
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.cycle()"
        [attr.aria-label]="themeToggleLabel()"
        [title]="themeToggleLabel()"
      >
        @switch (theme.choice()) {
          @case ('light') {
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
          }
          @case ('dark') {
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          }
          @default {
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg>
          }
        }
      </button>
      <button
        type="button"
        class="theme-toggle sign-out"
        (click)="signOut()"
        [disabled]="signingOut()"
        [attr.aria-label]="auth.user()?.email ? 'Sign out ' + auth.user()?.email : 'Sign out'"
        [title]="auth.user()?.email ? 'Sign out (' + auth.user()?.email + ')' : 'Sign out'"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </div>
</header>
@if (versionCheck.updateAvailable()) {
  <div class="update-banner" role="status" aria-live="polite">
    <div class="update-banner__inner">
      <svg class="update-banner__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3.5-7.1" />
        <polyline points="21 4 21 10 15 10" />
      </svg>
      <span class="update-banner__text">A new version is available.</span>
      <button type="button" class="update-banner__action" (click)="reloadForUpdate()">
        Refresh
      </button>
    </div>
  </div>
}
<main class="shell-main">
  <router-outlet />
</main>
