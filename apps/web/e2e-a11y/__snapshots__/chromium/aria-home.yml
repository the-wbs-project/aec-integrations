  - region "The way AEC firms find software is broken":
    - paragraph: Why this exists
    - heading "The way AEC firms find software is broken" [level=2]
    - paragraph: AEC firms make six and seven figure software decisions on platforms shaped by pay-to-play rankings and vendor-funded visibility. The tools at the top are often the ones that paid the most, not the ones that fit the work.
    - paragraph: "Meanwhile the information that actually decides a purchase is hard to find: whether an integration really works, and what implementation takes once the sales pitch ends."
    - list:
      - listitem:
        - paragraph: ≈<n>%
        - paragraph: of Google reviews were AI-generated by late <n>, up from about <n>% in <n>
        - paragraph:
          - text: Originality.AI, <n>. AI-generated reviews on Google rose from about <n>% in <n> to <n>% by the end of <n>. Measured on Google reviews; no equivalent study exists for B<n>B software review sites.
          - link "Source for the <n>% AI-generated figure, Originality.AI (opens in a new tab)":
            - /url: https://originality.ai/blog/ai-google-reviews-study
      - listitem:
        - paragraph: $<n>K
        - paragraph: a year is what a typical vendor pays for paid visibility on a leading review site
        - paragraph:
          - text: Vendr, <n>. The median annual amount vendors pay for G<n>, across <n> purchases. Paid plans and add-ons scale to $<n>K or more.
          - link "Source for the $<n>K paid visibility figure, Vendr (opens in a new tab)":
            - /url: https://www.vendr.com/marketplace/g2
      - listitem:
        - paragraph: <n>+
        - paragraph: tools lumped into generic categories with no way to filter by AEC discipline
        - paragraph:
          - text: Capterra, <n>. Its single construction management category alone lists about <n> products, with no facet for AEC discipline.
          - link "Source for the <n>+ generic category figure, Capterra (opens in a new tab)":
            - /url: https://www.capterra.com/construction-management-software/
    - heading "What we do instead" [level=3]
    - list:
      - listitem:
        - heading "Every connection is documented" [level=4]
        - paragraph: Each integration records what it links, the mechanism behind it, and where it falls short. A logo count tells you none of that.
      - listitem:
        - heading "Position is earned, never bought" [level=4]
        - paragraph: Rankings are algorithmic. Listings are never boosted by spend, and there is no pay-for-placement.
      - listitem:
        - heading "Organized the way AEC works" [level=4]
        - paragraph: Browse by AEC category, project phase and role, not a generic software taxonomy with construction added as an afterthought.
    - link "How we rank":
      - /url: /docs/trust/how-ranking-works
  - region "If you build AEC software, your product may already be listed here.":
    - paragraph: For vendors
    - heading "If you build AEC software, your product may already be listed here." [level=2]
    - paragraph: AEC Integrations lists products and their integrations independently. Vendors claim a listing to correct the facts and keep them current, and position in the directory is never for sale.
    - link "Claim or list your product":
      - /url: /vendor-program
    - heading "Think we're missing a tool?" [level=3]
    - paragraph: Tell us what to add or what to cover next.
    - button "Suggest a tool"
