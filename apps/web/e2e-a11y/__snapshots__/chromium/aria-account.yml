    - heading "Delete account" [level=2]
    - paragraph: Permanently delete your account. This can't be undone. Reviews you've published stay online. They never showed your name or profile, and they are no longer linked to your account. The text stays as written, so anything in it that identifies you will remain visible.
    - paragraph: If you sent messages to another company in a private conversation, they stay with the conversation for <n> years after its last message, with your name removed. The text may still identify you.
    - paragraph: When you sign in, we record that you accepted the Terms of Service. We keep that record for <n> years after you delete your account. It holds your email address, the time and the version.
    - paragraph: If we received a copyright notice or counter-notice that names your account, we keep it for <n> years after we close the matter. It is no longer linked to your account.
    - paragraph:
      - text: We also keep the record of what you submitted or changed, any agreement you accepted for a company, and what the law requires us to keep, such as a record tied to a legal request.
      - link "Read the Retention section of our Privacy Policy.":
        - /url: /legal/privacy
    - button "Delete account"
