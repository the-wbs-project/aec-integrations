<!-- AECI-2125: the console language. A compact secondary opener, the field recipe,
     and a primary "Save mapping": a saved mapping can be edited again, so it is not
     a danger action. -->
@if (!open()) {
<button aecButton variant="secondary" compact (click)="openForm()">
  <span i18n="@@admin.connectors.mapping.edit">Edit</span>
  <span class="sr-only" i18n="@@admin.connectors.mapping.editFor">
    mapping for {{ listing() }}</span
  >
</button>
} @else {
<form
  method="dialog"
  novalidate
  class="mt-2 grid max-w-[32rem] gap-4 border-t border-(--border-default) pt-4"
  (aecSubmit)="submit()"
>
  <aec-select
    i18n-label="@@admin.connectors.mapping.status.label"
    label="Status"
    layout="stacked"
    [options]="statusOptions"
    [value]="status()"
    [idPrefix]="idPrefix() + '-status'"
    (changed)="onStatusChange($event)"
  />

  @if (namesProduct()) {
  <div class="grid gap-2">
    <label
      [class]="labelClass"
      [attr.for]="idPrefix() + '-product'"
      i18n="@@admin.connectors.mapping.product.label"
    >
      Product
    </label>
    @if (product(); as p) {
    <p class="flex flex-wrap items-center gap-2 text-t-16 text-(--text-primary)">
      <span data-chosen-product>{{ p.name }}</span>
      <button
        #changeButton
        aecButton
        variant="ghost"
        (click)="clearProduct()"
        i18n="@@admin.connectors.mapping.product.change"
      >
        Change
      </button>
    </p>
    } @else {
    <aec-product-combobox
      [inputId]="idPrefix() + '-product'"
      [search]="search"
      i18n-placeholder="@@admin.connectors.mapping.product.placeholder"
      placeholder="Search published products"
      (picked)="chooseProduct($event)"
      (announce)="announce.emit($event)"
    />
    }
  </div>
  }

  <aec-select
    i18n-label="@@admin.connectors.mapping.confidence.label"
    label="Confidence"
    layout="stacked"
    [options]="confidenceOptions"
    [value]="confidence()"
    [idPrefix]="idPrefix() + '-confidence'"
    (changed)="onConfidenceChange($event)"
  />

  <div class="grid gap-2">
    <label
      [class]="labelClass"
      [attr.for]="idPrefix() + '-evidence'"
      i18n="@@admin.connectors.mapping.evidence.label"
    >
      Evidence link (optional)
    </label>
    <input
      [id]="idPrefix() + '-evidence'"
      type="url"
      inputmode="url"
      maxlength="2048"
      [class]="inputClass"
      placeholder="https://"
      [value]="evidenceUrl()"
      (input)="onEvidenceInput($event)"
    />
  </div>

  <!-- Said out loud: saving is what makes a matched row public on the reach line. -->
  <p [class]="hintClass" i18n="@@admin.connectors.mapping.decider">
    Saving records AECi as the decider. A matched listing then counts toward the product's public
    reach.
  </p>

  <div class="flex flex-wrap gap-2">
    <button aecButton type="submit" [disabled]="pending()">
      @if (pending()) {
      <span i18n="@@admin.connectors.mapping.working">Saving…</span>
      } @else {
      <span i18n="@@admin.connectors.mapping.save">Save mapping</span>
      }
    </button>
    <button
      aecButton
      variant="ghost"
      [disabled]="pending()"
      (click)="closeForm()"
      i18n="@@admin.connectors.mapping.cancel"
    >
      Cancel
    </button>
  </div>
</form>
} @if (failedMessage()) {
<p class="mt-2 text-t-14 font-semibold text-(--text-primary)" role="alert">{{ failedMessage() }}</p>
}
