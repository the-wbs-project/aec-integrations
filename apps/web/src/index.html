      Site-wide brand name for Google's site-name system and link unfurls. Static
      because it never varies by page or locale (a proper noun, like SITE_NAME in
      meta.helpers.ts). Keep it identical to the home WebSite JSON-LD name.
    -->

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      crossorigin="use-credentials" is required because non-prod hostnames
      (staging + aeci-*.thewbsproject.workers.dev) sit behind Cloudflare Access.
      Manifest fetches omit credentials by default even same-origin, so without
      this the Access cookie isn't sent, Access 302s the fetch to its login
      origin, and the cross-origin redirect fails CORS. Harmless in prod (no
      Access gate) — it just sends same-origin cookies. See docs/access.md.
    -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!--
      Early input (AECI-1720). A visitor can type in a server-rendered form field before the
      app's scripts load. Hydration then writes each field's starting value over the control,
      so the answer was lost. This keeps the last value of each text field, select and radio
      group, from input and change events the browser dispatched, whether the visitor, an
      extension or a script's click() caused them (an input or change event a script
      dispatches itself is not trusted and is not kept). So
      it holds nothing the same action after hydration would not have put in the form. A
      value the browser restored on Back fires no event and is not kept. No checkbox is ever
      kept: consent boxes are disabled until the app is live and are never carried.
      AecEarlyInput (app/shared/form-field/early-input.ts) reads each value once. Once the
      app is stable, App calls stop(): the listeners go, the values go, and the global is
      deleted. The global is a non-writable property, so plain assignment cannot replace it.
      It stays configurable because stop() must be able to delete it, so a script could still
      redefine it with Object.defineProperty. Element keys are held
      weakly. Static, so the cached HTML stays the same for every visitor.
    -->
    <script>
      (function (d, w) {
        var kept = new WeakMap();
        var live = true;
        function keep(e) {
          var t = e.target;
          if (!live || !e.isTrusted || !t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
          if (/^(checkbox|file|password)$/.test(t.type) || t.hasAttribute('aecconsent')) return;
          if (t.type === 'radio' && t.name) {
            var group = (t.form || d).querySelectorAll('input[type="radio"]');
            for (var i = 0; i < group.length; i++)
              if (group[i].name === t.name) kept.delete(group[i]);
          }
          kept.set(t, { value: t.value, checked: t.checked });
        }
        function take(el) {
          if (!live) return undefined;
          var value = kept.get(el);
          kept.delete(el);
          return value;
        }
        function stop() {
          live = false;
          kept = new WeakMap();
          d.removeEventListener('input', keep, true);
          d.removeEventListener('change', keep, true);
          delete w.__aeciEarlyInput;
        }
        Object.defineProperty(w, '__aeciEarlyInput', {
          value: Object.freeze({ take: take, stop: stop }),
          writable: false,
          enumerable: false,
          configurable: true,
        });
        d.addEventListener('input', keep, true);
        d.addEventListener('change', keep, true);
      })(document, window);
    </script>

      /* Size-matched fallback faces (AECI-1892). Until the web fonts arrive, text paints in

         font's ascent and descent, so lines break in the same places and the swap moves
         nothing. Measured in Chromium against a corpus of real headings and body lines.

         the fonts Windows, macOS and iOS ship), Arial for Atkinson Hyperlegible Next.
