<!--
  Smooth scrolling is scoped to in-page section links (AECI-1752). To restore the
  old global smooth scroll, add class="aeci-smooth-scroll" to the html element
  below. See app/core/in-page-smooth-scroll.ts.
-->
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>AEC Integrations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Site-wide brand name for Google's site-name system and link unfurls. Static
      because it never varies by page or locale (a proper noun, like SITE_NAME in
      meta.helpers.ts). Keep it identical to the home WebSite JSON-LD name.
    -->
    <meta property="og:site_name" content="AEC Integrations" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      crossorigin="use-credentials" is required because non-prod hostnames
      (staging + aeci-*.thewbsproject.workers.dev) sit behind Cloudflare Access.
      Manifest fetches omit credentials by default even same-origin, so without
      this the Access cookie isn't sent, Access 302s the fetch to its login
      origin, and the cross-origin redirect fails CORS. Harmless in prod (no
      Access gate) — it just sends same-origin cookies. See docs/access.md.
    -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <!--
      The two web fonts are self-hosted (AECI-1892): public/fonts/, licences beside them,
      served with a one-year immutable Cache-Control (public/_headers). A file never
      changes under its name: a new font version is a new file name. The two latin files
      every page paints with are preloaded, so they start with the HTML. The other
      subsets load only when a page has a character in their unicode-range.
    -->
    <link
      rel="preload"
      href="/fonts/atkinson-hyperlegible-next-v7-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/source-serif-4-v15-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
