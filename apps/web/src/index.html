<!doctype html>
<html lang="en-US" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>AEC Integrations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!--
      crossorigin="use-credentials" is required because non-prod hostnames
      (staging + *.aec-integrations.workers.dev) sit behind Cloudflare Access.
      Manifest fetches omit credentials by default even same-origin, so without
      this the Access cookie isn't sent, Access 302s the fetch to its login
      origin, and the cross-origin redirect fails CORS. Harmless in prod (no
      Access gate) — it just sends same-origin cookies. See docs/access.md.
    -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
