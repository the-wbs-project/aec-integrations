  Rulings of 2026-11-23. Chris ruled the wording. He left the other five to the
  orchestrator ("your call"), so items 2 to 6 are the orchestrator's decisions:
  1. Chris: the wheel's text says products and integrations, never partners. The
     first slide is "All integrations" over "54 products"; "1 product" in the singular.
  2. Cut-offs fit the rendered width: one ring while every tile fits at the smallest
     size (28px beside the text, 24px on a phone), then a second ring (not on phones)
     while that fits, then dots. "Fixed numbers" stays in the control strip only to compare.
  3. One tile size per product. It is set once, from the "All" slide, or from the
     largest tiled slide when "All" is dots, at the largest size that slide fits in its
     mode. Every tiled slide uses it, and takes the first mode that fits at that size.
  4. A dots slide keeps both counts: products under the title, integrations in the centre.
  5. Names under tiles are on for slides of 8 or fewer. They are off when the stage is
     under 260px (320 wide), where they run into the tiles and the hub.
  6. The Clay mark at 12 o'clock, the arrows beside the title and the guide circles stay.
  7. Legal agent's approved wording for the line under the wheel: on a tile slide
     "Shown A to Z. Position is not a ranking."; on a dots slide "Too many to show as
     tiles. Each dot is one integration." There is one dot per integration, so the dots
     always equal the integrations count in the centre (388 for Procore's 387 products).
  8. (Replaced by ruling 64.) Until 2026-11-24 a tile showed a logo only for a claimed
     listing.

  Ruling 64, Chris, 2026-11-24 (LEGAL_COUNSEL_RECORD.md ruling 64; wording corrected the
  same day). It widens the AECI-1769 logo rule for the wheel only:
  - A tile shows the product's logo whenever we hold one, claimed or not, and its initial
    only when we hold none. Every tile is the same size and nothing marks, badges, dims or
    outlines an unclaimed tile. The data keeps "claimed" and "has a logo" apart. Both are
    stand-ins here: about 3 in 10 claimed, about 1 in 6 with no logo.
  - Every logo sits inset on the same neutral tile as an initial. No vendor colour reaches
    the ground, ring, border or card of an unclaimed product (ruling 34 stands).
  - On every tile slide, whatever the mix, two lines under the wheel, same size, weight
    and colour (13px, 400, #C5D3CA on the #26473A panel, 6.62:1):
      "Shown A to Z. Position is not a ranking."
      "Logos identify products only and imply no endorsement or affiliation. Listings may
       be unclaimed."
    They are in the server HTML and in the ring's description for screen readers. Each
    phrase is kept together where it fits, so no line breaks mid-phrase.
  - The card shows logo (or initial), name and vendor. An unclaimed listing adds the text
    label "Unclaimed" beside the name, read with it ("Name, Unclaimed"). A claimed one
    has no label.
  - A dots slide shows no logos, so it keeps only "Too many to show as tiles. Each dot
    is one integration."
  - The centre of a tile slide still shows the page's own product by the old rule.
  The "Listings" control (mixed, all claimed, all unclaimed) changes only the card label.

  Final pass, 2026-11-24. Chris said "build it". Item 1 is his; 2 to 5 are the
  orchestrator's decisions:
  1. Chris: the card opens toward the centre of the wheel. It stays inside the stage from
     top to bottom, so it never covers the title or the lines under the wheel, and inside
     the screen from side to side.
  2. The lines under the wheel take the panel's padding as well (16px each side from 768,
     12px below), so the logo line wraps less. Rows, line 1 + line 2: 1440 1+2, 1024 1+2,
     390 1+2, 375 1+3, 320 1+3. The logo line needs 552px at 13px and the panel is 540px
     at its widest, so two rows in total does not fit at any width.
  3. On desktop a slide with more than 20 products takes two rings ("Second ring from"
     compares 18, 20 and 24 in the control strip; 20 is the recommendation by eye). Tiles
     stay large: 48px on one ring, 40px when the second ring opens, shrinking to 28px.
  4. Ring count is decided per slide at the product's one tile size. The inner guide
     circle fades out on a one-ring slide and back on a two-ring slide (280ms, off under

  5. A one-ring slide sits on the outer circle, so the wheel is the same size on every
