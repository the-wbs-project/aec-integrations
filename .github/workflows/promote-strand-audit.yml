# AEC Integrations — promote strand audit (AECI-568 / AECI-593 / AECI-796).
#
# Scheduled READ-ONLY cross-reference of production D1 against the review app's curation
# catalog. Runs `scripts/ops/2026-09-stranded-row-audit/audit.mjs`, which classifies every
# public row that no upstream record claims and exits non-zero if any bucket is non-empty:
#
#   productRejectedUpstream      D1 product whose upstream record is `rejected`
#   productDeletedUpstream       D1 product no upstream record claims at all
#   vendorNoLiveProducts         D1 vendor whose products have all moved away
#   vendorSourceGone             D1 vendor whose upstream record is gone
#   integrationSourceGone        D1 integration edge no upstream record claims
#   integrationEndpointStranded  an edge whose endpoint product is itself stranded
#
# Triggers are `schedule` + `workflow_dispatch` only, and the job consumes no event payload —
# no issue/PR/commit text reaches a `run:` block, so there is no injection surface here. The
# only inputs are three secrets, all passed via `env:` and referenced as shell variables.
#
# WHY THIS IS SCHEDULED, not a PR check. The link between the two systems lives only in the
# review app's `supabase_*_id` columns — D1 stores no curation-tool key (AECI-562 was
# rejected deliberately). So drift is created by *operator* actions against live data, not
# by merging code, and the most durable source is one promote cannot guard at all: **a
# curator deleting a record whose D1 row still exists.** Promote has no delete semantics, so
# that always leaves a stranded row, and nothing else will ever notice. AECI-593 was exactly
# that — two retracted Polycam edges, live and indexed for four WEEKS under an issue marked
# Done. This job is how the next one gets caught the next morning.
#
# ── WHY THIS WORKFLOW WAS REWRITTEN (AECI-796) ─────────────────────────────────────────
#
# It used to read Airtable and it never ran. Two independent failures, and the second is why
# the first was never noticed:
#
#   1. It skipped GREEN when `AIRTABLE_TOKEN` was absent, on the reasoning that a
#      red-on-arrival cron trains people to ignore the cron. That secret was never added, so
#      all 25 scheduled runs between 2026-08-13 and 2026-09-06 reported `success` having
#      audited nothing. A dead guard is indistinguishable from a healthy one.
#   2. The review app moved off Airtable onto its own D1, so the script those runs were
#      skipping had ALSO gone obsolete — `api.airtable.com` is decommissioned and no PAT
#      could have revived it.
#
# Hence: a transport we actually hold a credential for (`AECI_MCP_TOKEN`, the review-app MCP
# bearer), and NO skip-green branch. A missing credential is now exit 2 and red.
#
# ── THIS JOB FAILS RED. DO NOT RESTORE A SKIP BRANCH, DO NOT ADD continue-on-error. ────
#
# The temptation is real and it is documented above as the exact defect this rewrite exists
# to remove. "The audit is unchecked" is NOT "the catalog is fine". Both are red, and the
# annotations say which is which. The correct precedents are
# `.github/workflows/posthog-liveness-sweep.yml` and `.github/workflows/reconcile-counts.yml`
# — scheduled correctness guards that go red and explain themselves.
#
#   exit 0  clean and complete
#   exit 1  stranded rows found
#   exit 2  could not check — missing credential, bad args, incomplete sweep, or a crash
#
# PRODUCTION ONLY, deliberately. There is one curation catalog for all deploy tiers and it
# holds *production* uuids, so comparing it against staging/demo/preview's seeded catalogs
# reports near-total mismatch. The script itself warns when pointed elsewhere; there is no
# matrix here on purpose.
#
# NEVER heals. The script has no --apply and no write path, and `mcp-client.mjs` refuses any
# tool outside a read-only allow-list — the same MCP server exposes `promote_product` and the
# `create_*`/`update_*` family. Every bucket's repair is a deliberate, judgement-bearing
# operator action. Recipes: docs/RUNBOOKS.md §"Promote strand audit is red".
#
# RATE BUDGET. The review app rate-limits at 100 requests / 10 s keyed on `CF-Connecting-IP`,
# and the check runs BEFORE auth, so this job shares a budget with anything else on the
# runner's egress IP. The script reads at concurrency 3 (~5 rps) with backoff on 429. One run
# per day. Raising the cadence or `AECI_MCP_CONCURRENCY` needs a fresh look at that ceiling.
#
# Required secrets:
#   AECI_MCP_TOKEN        Bearer for https://review.aecintegrations.com/mcp — the same
#                         credential `.mcp.json` uses for the `aeci-review` server.
#                         Read-only by construction on this side (the client's allow-list).
#   CLOUDFLARE_API_TOKEN  Account → D1 → Read (CICD_PLAN §7.1); authenticates the
#                         `wrangler d1 execute --remote` reads.
#   CLOUDFLARE_ACCOUNT_ID Passed for parity with the other wrangler jobs. Not strictly
#                         required — `apps/api/wrangler.jsonc` already declares
#                         `account_id` — which is why it gets no empty-check below.

name: promote-strand-audit

on:
  schedule:
    # Daily at 09:00 UTC — an hour after reconcile-counts.yml so the two read-only
    # prod-D1 drift guards don't contend, and the overnight promote window is done.
    - cron: '0 9 * * *'
  workflow_dispatch: {}

concurrency:
  group: promote-strand-audit
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 default flip;
  # mirrors the other workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  audit:
    name: Strand audit (production)
    runs-on: ubuntu-latest
    # 20, not the old 10 — headroom, not a measurement. The review app's `list_products` /
    # `list_vendors` projections now carry `supabaseId`, so most records resolve straight off
    # the paged list instead of costing a `get_product` each: measured 2026-09-08, 252 of 290
    # products and 167 of 193 vendors came from the list, leaving ~64 fallback calls and a
    # ~2-minute run. The script prints a `fastPath:` line every run saying which path it took.
    # If that line ever shows `fromList: 0` the projection has regressed and the run reverts to
    # ~300 rate-limited calls at concurrency 3 — which is what this ceiling is sized for.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # The script shells out to apps/api's local wrangler binary.
      - run: pnpm install --frozen-lockfile

      - name: Audit production D1 against the review app
        env:
          AECI_MCP_TOKEN: ${{ secrets.AECI_MCP_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # exit 2, not 0 and not 1. See the header: an unchecked audit is not a pass, and it
          # is not a finding either. The script draws the same line internally.
          if [ -z "$AECI_MCP_TOKEN" ]; then
            echo "::error::AECI_MCP_TOKEN is not set, so the strand audit is UNCHECKED — this is not a pass. It is the bearer for https://review.aecintegrations.com/mcp (the same one .mcp.json uses). Add it under Settings → Secrets and variables → Actions."
            exit 2
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty, so the production D1 half cannot be read. Account → D1 → Read is sufficient. Configure it under Settings → Secrets and variables → Actions."
            exit 2
          fi
          # Every writable path goes to RUNNER_TEMP. All three outputs hold production catalog
          # content — names, uuids, public URLs — which is why the ops dir gitignores them, and
          # none of them is uploaded as an artifact. --refresh-cache is belt-and-braces on a
          # fresh runner: the snapshot is reused SILENTLY when present, so a future runner-cache
          # change must not be able to turn this into a replay of an old measurement.
          node scripts/ops/2026-09-stranded-row-audit/audit.mjs \
            --env production \
            --refresh-cache \
            --cache "$RUNNER_TEMP/upstream-cache.json" \
            --out "$RUNNER_TEMP/stranded-row-audit.json" \
            --ids-out "$RUNNER_TEMP/stranded-ids.txt"

      - name: Explain a red audit
        if: failure()
        run: |
          {
            echo "::error::The strand audit is red. Read the step log above FIRST — it prints the per-bucket counts and every stranded id, and the two states below are not the same problem."
            echo "::error::  exit 1 — stranded rows found. Production holds a row no upstream record claims."
            echo "::error::  exit 2 — the audit could NOT run: a missing credential, an incomplete sweep, or a crash. The catalog is unverified, not clean."
            echo "::error::Triage order for exit 1:"
            echo "::error::  1. docs/RUNBOOKS.md — 'Promote strand audit is red'. Bucket meanings and the repair recipes."
            echo "::error::  2. Read the upstream ruling BEFORE anything else. A stranded row is either an editorial retraction or duplicate residue, and that flips the repair from adopt to delete. Two worked examples, executed end to end: scripts/ops/2026-09-polycam-retraction/README.md (retraction) and scripts/ops/2026-09-procore-followup-retraction/README.md (merge residue)."
            echo "::error::  3. A tripped datatool guard is NOT evidence either way. orphansWithoutATwin is orientation-blind, so it reports 'no twin' on a reverse-orientation duplicate that plainly has one. Go to the claim data. See docs/REVIEW_APP_PROMOTE_API.md 5.1."
            echo "::error::  4. Never delete a row to make this job green. Retraction is a separate authorized action and needs a recorded ruling."
            echo "::error::Re-run locally for the full dump:"
            echo "::error::  AECI_MCP_TOKEN=<token> CLOUDFLARE_API_TOKEN=<token> node scripts/ops/2026-09-stranded-row-audit/audit.mjs --env production --refresh-cache"
          }
