# AEC Integrations — denormalized product-count reconciliation (AECI-104).
#
# Scheduled drift guard for the app-maintained product aggregates
# (`products.integration_count`, `review_count`, `rating_overall_avg`,
# `rating_onboarding_avg`). Runs `scripts/reconcile-product-counts.ts`
# REPORT-ONLY against staging (and prod) on the DEPLOYED Cloudflare D1 via
# `wrangler d1 execute --remote`: it recomputes the expected values from the
# `integrations` / `reviews` source rows and exits non-zero if any product's
# stored columns have drifted — which fails the job and notifies. The script
# also emits a Datadog gauge `aeci.product_counts.drift` (count of drifted
# products; 0 when clean) when DD_API_KEY is set, so a monitor can alert
# independently of the GitHub run.
#
# Drift means a write path mutated integrations/reviews without the post-batch
# `recomputeProductCounts()` landing (under D1 that recompute is a separate,
# non-atomic write after the mutating batch — see
# apps/api/src/lib/recompute-counts.ts). The drift RULE itself lives once in that
# file (`diffProductCounts` / `findProductCountDrift`); this job is the caller.
#
# Stack note (ADR 0016 / AECI-248→257): the app DB is Cloudflare D1, not
# Postgres. This job authenticates wrangler with CLOUDFLARE_API_TOKEN (the same
# secret deploy.yml / promote-to-prod.yml use for `wrangler d1 migrations
# apply`); the account id is read from apps/api/wrangler.jsonc. No Prisma, no
# DIRECT_URL.
#
# This is the DATA-drift counterpart to `drift-check.yml` (which only checks
# SCHEMA drift). Reconciliation only has meaning against real data, hence a
# scheduled run against the linked remotes rather than a PR check.
#
# NEVER runs `--fix` here — repair is a deliberate, reviewed action a human runs
# (`RECONCILE_ENV=<env> CLOUDFLARE_API_TOKEN=… pnpm --filter @aeci/api db:reconcile-counts -- --fix`).
#
# Required secrets:
#   CLOUDFLARE_API_TOKEN     scoped to Account → D1 → Read (CICD_PLAN §7.1)
#   DATADOG_API_KEY          Datadog API key (mapped to the script's DD_API_KEY)

name: reconcile-counts

on:
  schedule:
    # Daily at 08:00 UTC. Cheap read-only query; once a day is ample for a
    # slow-drift guard.
    - cron: '0 8 * * *'
  workflow_dispatch: {}

concurrency:
  group: reconcile-counts
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 default flip;
  # mirrors the other workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  reconcile:
    name: Reconcile ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      # Independent targets — don't cancel prod just because staging drifted.
      fail-fast: false
      matrix:
        target: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Reconcile product counts (report-only)
        env:
          # wrangler reads the account id from apps/api/wrangler.jsonc; the token
          # authenticates the remote D1 query.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RECONCILE_ENV: ${{ matrix.target }}
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_ENV: ${{ matrix.target }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is empty. Configure it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          pnpm --filter @aeci/api exec tsx scripts/reconcile-product-counts.ts

      - name: Explain drift on failure
        if: failure()
        env:
          TARGET: ${{ matrix.target }}
        run: |
          {
            echo "::error::Product-count drift detected on ${TARGET} (or the job failed to run)."
            echo "::error::A write path likely mutated integrations/reviews without the post-batch recomputeProductCounts() landing."
            echo "::error::To inspect + repair against the affected env (deliberate; never in CI):"
            echo "::error::  RECONCILE_ENV=${TARGET} CLOUDFLARE_API_TOKEN=<token> pnpm --filter @aeci/api db:reconcile-counts -- --fix"
            echo "::error::See docs/DATABASE_SCHEMA.md §11.2 and apps/api/src/lib/recompute-counts.ts."
          }
