# AEC Integrations — the accessibility nightly (AECI-1875, epic AECI-1874).
#
# WHAT. Three Playwright lanes against a local dev:bound, once a night. All are
#   separate from the PR e2e job in deploy.yml, which stays Chromium only.
#   1. `suite`: the suite in apps/web/e2e-a11y/ (config
#      apps/web/playwright.a11y-nightly.config.ts), in Chromium only
#      (`--project=chromium`), in SUITE_SHARDS shards.
#      Every surface in apps/web/e2e-a11y/surfaces.ts is visited. The checks
#      come from the AECI-1874 sub-issues. docs/TESTING_STRATEGY.md §8.4.
#   2. `e2e-axe` (AECI-1876): the whole e2e suite with the axe sweep on (config
#      apps/web/playwright.e2e-axe.config.ts, flag AECI_E2E_AXE=1), in
#      E2E_AXE_SHARDS shards. Every test that uses `page` ends with an axe scan.
#      WCAG 2.0/2.1 A and AA fail the test. wcag22aa, best-practice and
#      experimental are report only. docs/TESTING_STRATEGY.md §8.2 and §8.3.
#   3. `cross-browser` (AECI-1885, ADR 0060): the keyboard, focus ring and
#      announcement suites in Playwright's own Firefox and WebKit builds, the
#      `firefox` and `webkit` projects of the nightly config, in
#      FIREFOX_SHARDS and WEBKIT_SHARDS shards. Playwright WebKit is not
#      Safari. docs/TESTING_STRATEGY.md §8.4.10.
#   `report` merges the lanes' summaries into one a11y-nightly-summary.json
#   (scripts/a11y-nightly-merge-summary.mjs), writes the axe findings by rule and the
#   voice report (effort and target size, AECI-1883) and the IBM Equal Access
#   report (AECI-1884, report only) to the job summary, counts each browser's
#   outcomes (AECI-1885), and posts the commit status. All three lanes feed the
#   one `a11y-nightly` status and the one alert (ADR 0060, answer 2).
#
# TRIGGERS.
#   1. schedule, 05:40 UTC daily. Runs against main HEAD. Skips when that commit
#      already carries an `a11y-nightly: success`, or a `failure` whose
#      description ends `(nightly)`. A quiet main costs nothing. A nightly failure
#      is first posted as `(nightly, alert pending)`. Only the `confirm-alert` job
#      rewrites it to `(nightly)`, after Linear accepted the alert. So a failed
#      alert leaves the commit unskipped, and the next night runs and alerts again.
#   2. workflow_dispatch on any branch. Runs against the dispatched ref. Never
#      skips, never alerts.
#   3. workflow_dispatch with `update_snapshots` set to `firefox` or `webkit`
#      (ADR 0060, answer 5). Runs no lane and posts no status. The `snapshots`
#      job rewrites that browser's keyboard tab-order snapshots on the runner
#      and uploads them as `a11y-keyboard-snapshots-<browser>`, for a human to
#      review and commit. docs/TESTING_STRATEGY.md §8.4.10 has the commands.
#
# THE RESULT LIVES ON THE COMMIT. Each run posts a commit status, context
#   `a11y-nightly`: `pending` first (from `suite` shard 1), then `success`,
#   `failure`, or `error` when cancelled (from `report`, over all three lanes). Green
#   lanes with any expected summary missing post `failure`, and the description
#   says how many are missing. The description
#   ends `(nightly)` or `(manual)`. Same rule as lighthouse.yml. Only statuses
#   posted by github-actions[bot] count.
#
# ALERT. On a SCHEDULED run only, the `alert` job runs scripts/a11y-nightly-alert.mjs:
#   - red run: comment on the open Linear issue labelled `a11y-nightly-regression`,
#     or file a new AECI Bug if none is open.
#   - green run: comment "Recovered" on the open issue, if any. Never closes it.
#   Linear only, no email. docs/OBSERVABILITY.md owns the alert description.
#
# No event text (titles, messages, refs) reaches a run block. The only inputs
# are the SHA, the event name, the repo name and the `update_snapshots` choice,
# all passed through env. The choice can only be one of its listed options.
#
# Required repo secrets:
#   - SUPABASE_ANON_KEY, SUPABASE_TEST_USER_*, SUPABASE_VENDOR_TEST_USER_*: the
#     signed-in surfaces mint real sessions, as in the PR e2e job. Unset, those
#     surfaces skip green and the step warns.
#   - LINEAR_API_KEY: the alert job (scheduled runs only). Absent, the alert step
#     exits 2 and the run goes red.

name: a11y-nightly

on:
  # 05:40 UTC daily. Clear of the other crons (00:20, every 3 h at :20, 07:00,
  # 08:00, 09:00). Skips when main HEAD already has a result (see `resolve`).
  schedule:
    - cron: '40 5 * * *'
  # Manual run on any branch. Never alerts.
  workflow_dispatch:
    inputs:
      # ADR 0060 answer 5: WebKit on macOS and on Linux are different ports, so
      # a browser's tab-order snapshots may have to be written on the runner.
      # Anything but `none` runs only the `snapshots` job.
      update_snapshots:
        description: Rewrite one browser's keyboard snapshots on the runner instead of testing
        type: choice
        default: none
        options:
          - none
          - firefox
          - webkit

# One group per measured SHA, never cancelled. Two runs for the same SHA queue.
concurrency:
  group: a11y-nightly-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Each matrix must list exactly 1..its shard count, and its job name must say
  # /N. scripts/a11y-nightly-workflow.test.mjs checks both, for both lanes.
  E2E_AXE_SHARDS: '4'
  # The e2e-a11y suite (AECI-1874). docs/CICD_PLAN.md §11a-quater has the
  # measured per-shard times this count comes from.
  SUITE_SHARDS: '8'
  # The Firefox and WebKit lane (AECI-1885, ADR 0060 layout B): the browsers,
  # and how many shards each takes. The `cross-browser` matrix lists every
  # browser's shards 1..N with `of: N`. WebKit has more: on the Linux runner its
  # screenshots are about five times slower than on a Mac, and three shards ran
  # past the 30-minute limit on the first run (docs/CICD_PLAN.md §11a-quater).
  CROSS_BROWSERS: 'firefox webkit'
  FIREFOX_SHARDS: '3'
  WEBKIT_SHARDS: '6'

jobs:
  # ===========================================================================
  # Which commit, and does it still need a run?
  # ===========================================================================
  resolve:
    name: Resolve the commit to test
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      measure: ${{ steps.resolve.outputs.measure }}
      trigger: ${{ steps.resolve.outputs.trigger }}
      # `firefox` or `webkit` on a snapshot-only dispatch, else empty.
      snapshots: ${{ steps.resolve.outputs.snapshots }}
    steps:
      # The status lookup fails OPEN: if the API is unreachable, run anyway, so a
      # GitHub hiccup can never silence the nightly alarm.
      - name: Resolve the SHA and check for an existing a11y-nightly status
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          set -euo pipefail
          sha="$EVENT_SHA"
          if [ "$EVENT_NAME" = "schedule" ]; then
            trigger="nightly"
          else
            trigger="manual"
          fi
          measure=true
          # A snapshot-only dispatch tests nothing, so it measures nothing and
          # posts no status: a rewritten snapshot always matches itself.
          snapshots=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "${UPDATE_SNAPSHOTS:-none}" in
              firefox | webkit)
                snapshots="$UPDATE_SNAPSHOTS"
                measure=false
                echo "Snapshot-only run: rewriting the $snapshots keyboard snapshots. No lane runs, no status is posted."
                ;;
            esac
          fi
          if [ "$trigger" = "nightly" ]; then
            # Newest first. Only statuses this workflow posted count.
            if state="$(gh api "repos/$REPO/commits/$sha/statuses?per_page=100" \
                --jq '[.[] | select(.context == "a11y-nightly" and .creator.login == "github-actions[bot]")][0] | [(.state // ""), (.target_url // ""), (.description // "")] | @tsv')"; then
              IFS=$'\t' read -r existing url description <<<"$state" || true
              # Skip on any success, and on a failure only when its description
              # ends `(nightly)`: confirm-alert posts that after Linear accepted
              # the alert. A manual failure never alerted, and `(nightly, alert
              # pending)` means the alert did not land, so run again and alert.
              skip=false
              case "${existing:-}" in
                success) skip=true ;;
                failure) case "${description:-}" in *"(nightly)") skip=true ;; esac ;;
              esac
              case "$skip/${existing:-}" in
                true/*)
                  measure=false
                  echo "Skipping: main HEAD $sha already has a11y-nightly=$existing (${url:-no run link}). Nothing merged since it ran."
                  echo "Skipped. main HEAD \`$sha\` already has \`a11y-nightly: $existing\` ([run](${url:-#}))." >> "$GITHUB_STEP_SUMMARY"
                  ;;
                */failure)
                  echo "main HEAD $sha has a11y-nightly=failure that never alerted (${description:-no description}). Running."
                  ;;
                *)
                  echo "main HEAD $sha has no terminal a11y-nightly status (found: '${existing:-none}'). Running."
                  ;;
              esac
            else
              echo "::warning::Could not read commit statuses for $sha. Running anyway."
            fi
          fi
          echo "Running: $measure. SHA: $sha. Trigger: $trigger"
          {
            echo "sha=$sha"
            echo "measure=$measure"
            echo "trigger=$trigger"
            echo "snapshots=$snapshots"
          } >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # The e2e-a11y suite, in shards. Shard 1 posts the `pending` status; `report`
  # posts the result.
  # ===========================================================================
  # Each shard builds, boots its own dev:bound and local D1, and runs its slice,
  # as `e2e-axe` does. Playwright splits by test, and a plain `beforeAll`
  # group can be split. Only a describe in `serial` or `default` mode stays on
  # one shard, so a group that shares a `beforeAll` record must use one of the
  # two (docs/TESTING_STRATEGY.md §8.4 "Shards").
  suite:
    name: Accessibility nightly suite (shard ${{ matrix.shard }}/8)
    needs: resolve
    if: needs.resolve.outputs.measure == 'true'
    runs-on: ubuntu-26.04
    strategy:
      # Every shard's findings land, even when one is red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # docs/CICD_PLAN.md §11a-quater has the measured time per shard.
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      MEASURED_SHA: ${{ needs.resolve.outputs.sha }}
      TRIGGER: ${{ needs.resolve.outputs.trigger }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          # This job's token can write commit statuses. Do not leave it in
          # .git/config, where `pnpm install` scripts could read it.
          persist-credentials: false
      # `pending` first, so a run that dies before `report` posts leaves a
      # non-terminal status, which the nightly skip treats as "not run".
      # GH_TOKEN reaches this step only, never the whole job. One post per run:
      # shard 1 only.
      - name: Mark the a11y-nightly status pending
        if: matrix.shard == 1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$MEASURED_SHA" \
            -f state=pending -f context=a11y-nightly -f target_url="$RUN_URL" \
            -f description="Accessibility nightly is running on this commit ($TRIGGER)" > /dev/null
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # `dev:preview` serves the prebuilt dist/ and does not build, so the bundle
      # must exist before dev:bound boots. No cross-workflow artifact to reuse.
      - run: pnpm --filter @aeci/web build
      # Playwright browsers, cached per runner image. Same steps as the PR e2e job.
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The runner's Google Chrome apt source fails `apt-get update` during a
      # mirror sync. Chromium's deps come from Ubuntu's repos, so drop it.
      - name: Drop flaky Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aeci/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @aeci/web exec playwright install-deps chromium
      # The shared-auth Supabase config for both local Workers, as in the PR e2e
      # job. The app DB is local D1: dev:bound migrates and seeds it.
      - name: Write the .dev.vars files for `pnpm dev:bound`
        env:
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\n' > apps/api/.dev.vars
          if [ -n "$SUPABASE_ANON_KEY_VALUE" ]; then
            printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\nSUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY_VALUE" > apps/web/.dev.vars
          else
            echo "::warning::SUPABASE_ANON_KEY not set. The signed-in surfaces will skip."
          fi
      # Wait on /api/health, not `/`: it answers 200 only once the service
      # binding is up and D1 answers `SELECT 1`.
      - name: Boot dev:bound (API + SSR) and wait for /api/health
        run: |
          nohup pnpm dev:bound > dev-bound.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8788/api/health; then
              echo "dev:bound healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev:bound did not become healthy on :8788 within 90s"; tail -200 dev-bound.log; exit 1
      # PLAYWRIGHT_BASE_URL set, so the config skips its own webServer.
      - name: Accessibility nightly (Playwright)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8788
          SHARD: ${{ matrix.shard }}
          A11Y_COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
          A11Y_TRIGGER: ${{ needs.resolve.outputs.trigger }}
          SUPABASE_URL: https://ktuhnlypztujpsseujzx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          SUPABASE_VENDOR_TEST_USER_EMAIL: ${{ secrets.SUPABASE_VENDOR_TEST_USER_EMAIL }}
          SUPABASE_VENDOR_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_VENDOR_TEST_USER_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_TEST_USER_EMAIL" ] || [ -z "$SUPABASE_TEST_USER_PASSWORD" ]; then
            echo "::warning::SUPABASE_TEST_USER_EMAIL/PASSWORD not set. The reviewer and admin surfaces will skip."
          fi
          if [ -z "$SUPABASE_VENDOR_TEST_USER_EMAIL" ] || [ -z "$SUPABASE_VENDOR_TEST_USER_PASSWORD" ]; then
            echo "::warning::SUPABASE_VENDOR_TEST_USER_EMAIL/PASSWORD not set. The vendor surfaces will skip."
          fi
          # Chromium only. The config also holds the firefox and webkit projects
          # (AECI-1885), which `cross-browser` runs. Without the flag every
          # shard would run those too.
          pnpm --filter @aeci/web exec playwright test -c playwright.a11y-nightly.config.ts --project=chromium --shard="$SHARD/$SUITE_SHARDS"
      # `report` merges this with the other shards' summaries.
      - name: Keep the test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: a11y-nightly-summary-suite-${{ matrix.shard }}
          path: apps/web/a11y-nightly-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-a11y-${{ matrix.shard }}
          path: apps/web/playwright-report-a11y
          if-no-files-found: ignore
          retention-days: 30
      - name: dev:bound logs on failure
        if: failure()
        run: tail -200 dev-bound.log || true

  # ===========================================================================
  # The keyboard, focus ring and announcement suites in Firefox and WebKit
  # (AECI-1885, ADR 0060), in shards per browser
  # ===========================================================================
  # The same setup as `suite`, with two differences. Each browser has its own
  # Playwright cache key: the PR job and the other lanes save Chromium alone
  # under `playwright-…`, and a job that restored that cache could not launch
  # Firefox or WebKit. The run picks the browser's project, which holds only
  # the three suites (`testMatch` in the nightly config). No status token.
  cross-browser:
    name: Accessibility nightly, ${{ matrix.browser }} (shard ${{ matrix.shard }}/${{ matrix.of }})
    needs: resolve
    if: needs.resolve.outputs.measure == 'true'
    runs-on: ubuntu-26.04
    strategy:
      # Every shard's findings land, even when one is red.
      fail-fast: false
      # One entry per shard. `of` must equal the browser's *_SHARDS above.
      matrix:
        include:
          - { browser: firefox, shard: 1, of: 3 }
          - { browser: firefox, shard: 2, of: 3 }
          - { browser: firefox, shard: 3, of: 3 }
          - { browser: webkit, shard: 1, of: 6 }
          - { browser: webkit, shard: 2, of: 6 }
          - { browser: webkit, shard: 3, of: 6 }
          - { browser: webkit, shard: 4, of: 6 }
          - { browser: webkit, shard: 5, of: 6 }
          - { browser: webkit, shard: 6, of: 6 }
    # docs/CICD_PLAN.md §11a-quater has the measured time per shard.
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BROWSER: ${{ matrix.browser }}
      SHARD_TOTAL: ${{ matrix.of }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeci/web build
      # Its own key per browser, never the shared `playwright-…` one (ADR 0060
      # "Browser install and cache"). The save step logs the archive size.
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ matrix.browser }}-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Drop flaky Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aeci/web exec playwright install --with-deps "$BROWSER"
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @aeci/web exec playwright install-deps "$BROWSER"
      - name: Write the .dev.vars files for `pnpm dev:bound`
        env:
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\n' > apps/api/.dev.vars
          if [ -n "$SUPABASE_ANON_KEY_VALUE" ]; then
            printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\nSUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY_VALUE" > apps/web/.dev.vars
          else
            echo "::warning::SUPABASE_ANON_KEY not set. The signed-in surfaces will skip."
          fi
      - name: Boot dev:bound (API + SSR) and wait for /api/health
        run: |
          nohup pnpm dev:bound > dev-bound.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8788/api/health; then
              echo "dev:bound healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev:bound did not become healthy on :8788 within 90s"; tail -200 dev-bound.log; exit 1
      - name: Accessibility nightly in Firefox or WebKit (Playwright)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8788
          SHARD: ${{ matrix.shard }}
          A11Y_COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
          A11Y_TRIGGER: ${{ needs.resolve.outputs.trigger }}
          SUPABASE_URL: https://ktuhnlypztujpsseujzx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          SUPABASE_VENDOR_TEST_USER_EMAIL: ${{ secrets.SUPABASE_VENDOR_TEST_USER_EMAIL }}
          SUPABASE_VENDOR_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_VENDOR_TEST_USER_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_TEST_USER_EMAIL" ] || [ -z "$SUPABASE_TEST_USER_PASSWORD" ]; then
            echo "::warning::SUPABASE_TEST_USER_EMAIL/PASSWORD not set. The reviewer and admin surfaces will skip."
          fi
          if [ -z "$SUPABASE_VENDOR_TEST_USER_EMAIL" ] || [ -z "$SUPABASE_VENDOR_TEST_USER_PASSWORD" ]; then
            echo "::warning::SUPABASE_VENDOR_TEST_USER_EMAIL/PASSWORD not set. The vendor surfaces will skip."
          fi
          pnpm --filter @aeci/web exec playwright test -c playwright.a11y-nightly.config.ts --project="$BROWSER" --shard="$SHARD/$SHARD_TOTAL"
      - name: Keep the test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: a11y-nightly-summary-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/web/a11y-nightly-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-a11y-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/web/playwright-report-a11y
          if-no-files-found: ignore
          retention-days: 30
      - name: dev:bound logs on failure
        if: failure()
        run: tail -200 dev-bound.log || true

  # ===========================================================================
  # Rewrite one browser's keyboard snapshots on the runner (dispatch only)
  # ===========================================================================
  # ADR 0060 answer 5: Playwright's WebKit on macOS and on Linux are different
  # ports, so their Tab walks can differ. This job runs only the `tab walk`
  # tests, which own the snapshots, with --update-snapshots, and uploads the
  # browser's snapshot folder. Nothing is committed and no status is posted. A
  # human downloads the artifact, reviews the diff and commits it.
  snapshots:
    name: Rewrite the ${{ needs.resolve.outputs.snapshots }} keyboard snapshots
    needs: resolve
    if: needs.resolve.outputs.snapshots != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BROWSER: ${{ needs.resolve.outputs.snapshots }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeci/web build
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-a11y-${{ needs.resolve.outputs.snapshots }}-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Drop flaky Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aeci/web exec playwright install --with-deps "$BROWSER"
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @aeci/web exec playwright install-deps "$BROWSER"
      - name: Write the .dev.vars files for `pnpm dev:bound`
        env:
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\n' > apps/api/.dev.vars
          if [ -n "$SUPABASE_ANON_KEY_VALUE" ]; then
            printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\nSUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY_VALUE" > apps/web/.dev.vars
          else
            echo "::warning::SUPABASE_ANON_KEY not set. The signed-in surfaces will skip, and keep their old snapshots."
          fi
      - name: Boot dev:bound (API + SSR) and wait for /api/health
        run: |
          nohup pnpm dev:bound > dev-bound.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8788/api/health; then
              echo "dev:bound healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev:bound did not become healthy on :8788 within 90s"; tail -200 dev-bound.log; exit 1
      # A test may still fail on another check. The snapshots it wrote are kept.
      - name: Rewrite the keyboard snapshots
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8788
          SUPABASE_URL: https://ktuhnlypztujpsseujzx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          SUPABASE_VENDOR_TEST_USER_EMAIL: ${{ secrets.SUPABASE_VENDOR_TEST_USER_EMAIL }}
          SUPABASE_VENDOR_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_VENDOR_TEST_USER_PASSWORD }}
        run: pnpm --filter @aeci/web exec playwright test -c playwright.a11y-nightly.config.ts keyboard- --grep "tab walk" --project="$BROWSER" --update-snapshots=changed
      - name: Keep the rewritten snapshots
        uses: actions/upload-artifact@v6
        with:
          name: a11y-keyboard-snapshots-${{ needs.resolve.outputs.snapshots }}
          path: apps/web/e2e-a11y/__snapshots__/${{ needs.resolve.outputs.snapshots }}/
          if-no-files-found: error
          retention-days: 7
      - name: dev:bound logs on failure
        if: failure()
        run: tail -200 dev-bound.log || true

  # ===========================================================================
  # The e2e suite with the axe sweep on (AECI-1876), in shards
  # ===========================================================================
  # The same tests as the PR e2e job, run from playwright.e2e-axe.config.ts,
  # which sets AECI_E2E_AXE=1. Each test that uses `page` ends with an axe scan.
  # Same shape as deploy.yml's e2e-shard: every shard builds, boots its own
  # dev:bound and local D1, and runs its slice. No status token here.
  e2e-axe:
    name: E2E with the axe sweep (shard ${{ matrix.shard }}/4)
    needs: resolve
    if: needs.resolve.outputs.measure == 'true'
    runs-on: ubuntu-26.04
    strategy:
      # Every shard's findings land, even when one is red.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # About 3 minutes of setup plus the tests. docs/CICD_PLAN.md §11a-quater has
    # the measured time. A shard past 30 minutes is stuck, not slow.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeci/web build
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.ImageOS }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Drop flaky Google Chrome apt source
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @aeci/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @aeci/web exec playwright install-deps chromium
      - name: Write the .dev.vars files for `pnpm dev:bound`
        env:
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\n' > apps/api/.dev.vars
          if [ -n "$SUPABASE_ANON_KEY_VALUE" ]; then
            printf 'SUPABASE_URL="https://ktuhnlypztujpsseujzx.supabase.co"\nSUPABASE_ANON_KEY="%s"\n' "$SUPABASE_ANON_KEY_VALUE" > apps/web/.dev.vars
          else
            echo "::warning::SUPABASE_ANON_KEY not set. The signed-in e2e specs will skip."
          fi
      - name: Boot dev:bound (API + SSR) and wait for /api/health
        run: |
          nohup pnpm dev:bound > dev-bound.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8788/api/health; then
              echo "dev:bound healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev:bound did not become healthy on :8788 within 90s"; tail -200 dev-bound.log; exit 1
      # The same secrets as the PR e2e job. Unset, the signed-in specs skip green.
      - name: E2E with the axe sweep (Playwright)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8788
          SHARD: ${{ matrix.shard }}
          A11Y_COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
          A11Y_TRIGGER: ${{ needs.resolve.outputs.trigger }}
          SUPABASE_URL: https://ktuhnlypztujpsseujzx.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TEST_USER_EMAIL: ${{ secrets.SUPABASE_TEST_USER_EMAIL }}
          SUPABASE_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_TEST_USER_PASSWORD }}
          SUPABASE_VENDOR_TEST_USER_EMAIL: ${{ secrets.SUPABASE_VENDOR_TEST_USER_EMAIL }}
          SUPABASE_VENDOR_TEST_USER_PASSWORD: ${{ secrets.SUPABASE_VENDOR_TEST_USER_PASSWORD }}
        run: pnpm --filter @aeci/web exec playwright test -c playwright.e2e-axe.config.ts --shard="$SHARD/$E2E_AXE_SHARDS"
      - name: Keep the test summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: a11y-nightly-summary-e2e-axe-${{ matrix.shard }}
          path: apps/web/a11y-e2e-axe-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-e2e-axe-${{ matrix.shard }}
          path: apps/web/playwright-report-e2e-axe
          if-no-files-found: ignore
          retention-days: 30
      - name: dev:bound logs on failure
        if: failure()
        run: tail -200 dev-bound.log || true

  # ===========================================================================
  # Merge the summaries, then record the result on the commit
  # ===========================================================================
  # Runs on success, failure and cancellation, so every measured run leaves a
  # terminal status. It holds a statuses:write token, so it runs no
  # `pnpm install`: the merge script has no dependencies. Only the status step
  # gets the token, as GH_TOKEN. Every action here is pinned to a full SHA:
  # checkout, setup-node and download to the same ones as `alert`, and upload
  # to v6.0.0.
  report:
    name: Merge the summaries and record the result
    needs: [resolve, suite, e2e-axe, cross-browser]
    if: ${{ always() && needs.resolve.outputs.measure == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    outputs:
      outcome: ${{ steps.outcome.outputs.outcome }}
    env:
      MEASURED_SHA: ${{ needs.resolve.outputs.sha }}
      TRIGGER: ${{ needs.resolve.outputs.trigger }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The outcome comes from the lanes' results and from which summaries
      # arrived, never from the merge, so a failed merge or a failed status
      # post cannot change what the alert reports. The lanes are read first.
      - name: Decide the lanes' outcome
        id: lanes
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
          E2E_AXE_RESULT: ${{ needs.e2e-axe.result }}
          CROSS_BROWSER_RESULT: ${{ needs.cross-browser.result }}
        run: |
          set -euo pipefail
          # `success` only when every lane passed. A failure wins over a cancel:
          # a red lane must alert even when another lane was cancelled. Anything
          # else (cancelled, skipped, unknown) is `cancelled`.
          lanes=success
          for result in "${SUITE_RESULT:-unknown}" "${E2E_AXE_RESULT:-unknown}" "${CROSS_BROWSER_RESULT:-unknown}"; do
            case "$result" in
              success) ;;
              failure) lanes=failure ;;
              *) [ "$lanes" = failure ] || lanes=cancelled ;;
            esac
          done
          echo "suite=${SUITE_RESULT:-unknown} e2e-axe=${E2E_AXE_RESULT:-unknown} cross-browser=${CROSS_BROWSER_RESULT:-unknown} lanes=$lanes"
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # One folder per artifact, so the shards' same-named files do not collide.
      - name: Fetch the lane summaries
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: a11y-nightly-summary-*
          path: a11y-parts
      # Every expected part, one per shard of each lane, written to
      # expected-parts.txt for the merge. A shard that passed but uploaded no
      # summary is missing here. Runs even when a step above failed.
      - name: Check every summary arrived
        id: parts
        if: always()
        run: |
          set -euo pipefail
          : > expected-parts.txt
          for n in $(seq 1 "$SUITE_SHARDS"); do
            echo "a11y-parts/a11y-nightly-summary-suite-$n/a11y-nightly-summary.json" >> expected-parts.txt
          done
          for n in $(seq 1 "$E2E_AXE_SHARDS"); do
            echo "a11y-parts/a11y-nightly-summary-e2e-axe-$n/a11y-e2e-axe-summary.json" >> expected-parts.txt
          done
          for browser in $CROSS_BROWSERS; do
            case "$browser" in
              firefox) total="$FIREFOX_SHARDS" ;;
              webkit) total="$WEBKIT_SHARDS" ;;
              *) echo "::error::no shard count for $browser"; exit 1 ;;
            esac
            for n in $(seq 1 "$total"); do
              echo "a11y-parts/a11y-nightly-summary-$browser-$n/a11y-nightly-summary.json" >> expected-parts.txt
            done
          done
          missing=()
          while IFS= read -r part; do
            [ -f "$part" ] || missing+=("$part")
          done < expected-parts.txt
          echo "missing=${#missing[@]}" >> "$GITHUB_OUTPUT"
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Missing summaries"
              echo
              echo "${#missing[@]} expected summaries did not arrive, so the run fails:"
              echo
              for part in "${missing[@]}"; do echo "- \`$part\`"; done
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "missing=${#missing[@]} of $(wc -l < expected-parts.txt | tr -d ' ')"
      # Green lanes with a missing summary are a failure: a shard that ran but
      # recorded nothing must never post success. A failed or cancelled lane
      # keeps its outcome, so a failure still wins over a cancel.
      - name: Decide the run's outcome
        id: outcome
        if: always()
        env:
          LANES: ${{ steps.lanes.outputs.lanes }}
          MISSING: ${{ steps.parts.outputs.missing }}
        run: |
          set -euo pipefail
          outcome="${LANES:-cancelled}"
          # An unknown count is treated as missing: the check did not finish.
          if [ "$outcome" = success ] && ! [ "${MISSING:-x}" = 0 ]; then
            outcome=failure
          fi
          echo "lanes=${LANES:-unknown} missing=${MISSING:-unknown} outcome=$outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "missing=${MISSING:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Merge into a11y-nightly-summary.json
        continue-on-error: true
        run: |
          set -euo pipefail
          parts=()
          while IFS= read -r part; do parts+=("$part"); done < expected-parts.txt
          node scripts/a11y-nightly-merge-summary.mjs --out=a11y-nightly-summary.json \
            --markdown="$GITHUB_STEP_SUMMARY" "${parts[@]}"
      # The alert job reads this. AECI-1682 will read it for the dated record.
      - name: Keep the merged summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: a11y-nightly-summary
          path: a11y-nightly-summary.json
          if-no-files-found: warn
          retention-days: 30
      # A cancelled run posts `error`, which the nightly skip does not treat as
      # a result. A failure here turns the job red.
      - name: Record the a11y-nightly status on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.outcome.outputs.outcome }}
          MISSING: ${{ steps.outcome.outputs.missing }}
        run: |
          # Name missing summaries in the description. The job summary lists them.
          failed="Accessibility nightly failed"
          case "${MISSING:-unknown}" in
            0) ;;
            unknown) failed="$failed, summaries unchecked" ;;
            *) failed="$failed, $MISSING summaries missing" ;;
          esac
          case "$OUTCOME" in
            success) state=success; description="Accessibility nightly passed ($TRIGGER)" ;;
            failure)
              state=failure
              # A nightly failure is not final until the alert lands. The
              # skip rule matches only a description ending `(nightly)`, so
              # `(nightly, alert pending)` makes the next night run again.
              if [ "$TRIGGER" = "nightly" ]; then
                description="$failed (nightly, alert pending)"
              else
                description="$failed ($TRIGGER)"
              fi
              ;;
            *) state=error; description="Accessibility nightly was cancelled before a result ($TRIGGER)" ;;
          esac
          gh api -X POST "repos/$REPO/statuses/$MEASURED_SHA" \
            -f state="$state" -f context=a11y-nightly -f target_url="$RUN_URL" \
            -f description="$description" > /dev/null
          echo "Posted a11y-nightly=$state on $MEASURED_SHA ($RUN_URL)"
          echo "\`a11y-nightly: $state\` posted on \`$MEASURED_SHA\`." >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # Alert a human (scheduled runs only)
  # ===========================================================================
  # Not on workflow_dispatch: someone is already watching. Not on the skip path:
  # `report` is skipped then, so its outcome matches neither result below.
  alert:
    name: Alert on the nightly result
    needs: [resolve, report]
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
      needs.resolve.outputs.measure == 'true' &&
      (needs.report.outputs.outcome == 'failure' || needs.report.outputs.outcome == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MEASURED_SHA: ${{ needs.resolve.outputs.sha }}
      OUTCOME: ${{ needs.report.outputs.outcome }}
    steps:
      # Pinned to full commit SHAs, the same ones as lighthouse.yml: this job
      # holds a write-capable Linear key, so a moved tag must not swap the code
      # that runs next to it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      # No pnpm here, so turn off setup-node's package-manager cache (see
      # lighthouse.yml for the failure it caused there).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Missing on a run that failed before the reporter wrote it. The script
      # then files the alert with "no test summary, see the run log".
      - name: Fetch the test summary
        if: needs.report.outputs.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: a11y-nightly-summary
          path: a11y-results
      - name: Linear (file, comment, or recover)
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/a11y-nightly-alert.mjs linear --outcome="$OUTCOME" --summary=a11y-results/a11y-nightly-summary.json

  # ===========================================================================
  # Mark a nightly failure as alerted (only after Linear accepted the alert)
  # ===========================================================================
  # Separate from `alert` so the job holding the Linear key gets no
  # statuses:write token, and this one gets no Linear key. If `alert` failed,
  # this job does not run, the status keeps `(nightly, alert pending)`, and the
  # next scheduled run tests the same commit again and retries the alert.
  confirm-alert:
    name: Mark the nightly failure as alerted
    needs: [resolve, report, alert]
    if: >-
      ${{ !cancelled() && github.event_name == 'schedule' &&
      needs.report.outputs.outcome == 'failure' && needs.alert.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MEASURED_SHA: ${{ needs.resolve.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Record the alerted failure on the commit
        run: |
          gh api -X POST "repos/$REPO/statuses/$MEASURED_SHA" \
            -f state=failure -f context=a11y-nightly -f target_url="$RUN_URL" \
            -f description="Accessibility nightly failed (nightly)" > /dev/null
          echo "Posted a11y-nightly=failure (nightly, alerted) on $MEASURED_SHA"
