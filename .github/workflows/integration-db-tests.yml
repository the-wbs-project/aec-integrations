# AEC Integrations — apps/api integration suites against a full local Supabase
# stack (AECI-90). Extracted from deploy.yml so it runs ONLY when something that
# could affect its outcome changes, instead of booting a full Supabase stack
# (~4 billable min) on every PR push.
#
# These are the security-/correctness-critical suites:
#   src/integration/vendor_requests.rls.spec.ts          (PostgREST deny matrix)
#   src/integration/landing_forms.rls.spec.ts            (PostgREST deny matrix)
#   src/integration/auth_user_delete_trigger.spec.ts     (GDPR delete trigger)
#   src/integration/airtable-to-supabase-bulk-migrate.spec.ts (idempotent migrate)
#   src/integration/product-counts.spec.ts               (denormalized-count drift)
#   src/integration/backfill-slugs.spec.ts               (slug backfill)
#
# Why local Supabase (not the shared dev DB): the auth-delete suite
# creates+deletes auth.users and the bulk-migrate suite inserts+deletes
# products/vendors/taxonomy. Running those against DATABASE_URL_STAGING (the
# dev DB staging serves, Option 1 in docs/environments.md) would be destructive
# and flaky. A local stack isolates the writes and supplies every key the specs
# need with NO repo secrets. Pattern mirrors drift-check.yml, but boots the FULL
# stack (PostgREST + GoTrue), not Postgres-only.
#
# WHEN THIS RUNS (path gate). The suites' outcome depends only on the migrated
# DB shape + the source they exercise, so the `paths:` filter below is the
# complete set of inputs (traced from the specs' imports):
#   - supabase/migrations/**         RLS policies, triggers, grants, schema
#   - supabase/config.toml           stack / Postgres version
#   - apps/api/prisma/schema.prisma  Prisma model the specs assert against
#   - apps/api/src/integration/**    the specs themselves
#   - apps/api/src/lib/**            product-counts.ts (imported directly)
#   - apps/api/scripts/**            bulk-migrate, backfill-slugs, lib/airtable
#   - apps/api/vitest.integration.config.ts
#   - this workflow file
# A UI-only (apps/web/**), docs, or unrelated-config PR can't change any of
# these, so it skips entirely and bills nothing.
#
# Backstop: a nightly `schedule:` run (and `workflow_dispatch:`) re-runs the
# full suite against a fresh stack on main once a day, so anything a transitive
# dependency outside the path set might have missed still surfaces within 24h.
#
# NON-BLOCKING posture is unchanged: this was never in deploy-staging.needs and
# isn't a required check. It reports red/green on PRs that touch DB code.

name: integration-db-tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - 'apps/api/prisma/schema.prisma'
      - 'apps/api/src/integration/**'
      - 'apps/api/src/lib/**'
      - 'apps/api/scripts/**'
      - 'apps/api/vitest.integration.config.ts'
      - '.github/workflows/integration-db-tests.yml'
  schedule:
    # Nightly backstop at 07:00 UTC (offset from reconcile-counts' 08:00 UTC).
    - cron: '0 7 * * *'
  workflow_dispatch: {}

# Per-PR concurrency — a fresh push cancels the in-flight stack boot. Scheduled
# runs land on refs/heads/main and won't collide with PR runs.
concurrency:
  group: integration-db-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 default flip;
  # mirrors the other workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  integration-db-tests:
    name: Integration suites (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The integration specs import @prisma/client directly (e.g.
      # auth_user_delete_trigger.spec.ts asserts via Prisma raw SQL). Generate
      # the client before running. `prisma generate` does not hit the DB.
      - run: pnpm --filter @aeci/api exec prisma generate
      - name: Install Supabase CLI
        run: npm install -g supabase@latest
      # `supabase start` boots the FULL stack (Postgres + GoTrue + PostgREST +
      # …) and replays every supabase/migrations/** file on a fresh DB. The RLS
      # suites hit PostgREST `/rest/v1/*` and the auth-delete suite hits GoTrue
      # `/auth/v1/admin/*`, so the Postgres-only `supabase db start` that
      # drift-check.yml uses would not be enough.
      - name: Boot local Supabase (full stack)
        run: supabase start
      # Remap the local stack's connection details into the env-var names the
      # specs read (see apps/api/.dev.vars.example). `supabase status -o env`
      # prints KEY="value" lines including API_URL, DB_URL, ANON_KEY,
      # SERVICE_ROLE_KEY — all well-known local values, not secrets.
      - name: Export Supabase connection env
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          # Log only the KEY names (not the local demo values) so a CLI-version
          # change in the output schema is diagnosable.
          echo "supabase status keys: $(cut -d= -f1 /tmp/supabase-status.env | tr '\n' ' ')"
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase-status.env
          set +a
          missing=
          for v in API_URL DB_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!v:-}" ]; then missing="${missing} ${v}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::supabase status -o env did not provide:${missing} — output keys were: $(cut -d= -f1 /tmp/supabase-status.env | tr '\n' ' ')"
            exit 1
          fi
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "TEST_DATABASE_URL=${DB_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      # Mint a non-admin authenticated-user JWT for the PostgREST RLS suites
      # (vendor_requests.rls / landing_forms.rls). Without it those suites
      # describe.skipIf themselves and the guard step below fails the job. The
      # service-role key creates a confirmed user (mirrors
      # auth_user_delete_trigger.spec.ts adminCreateUser); the password grant
      # returns that user's access_token.
      - name: Mint SUPABASE_TEST_USER_JWT
        run: |
          set -euo pipefail
          email="aeci90-ci-$(date +%s)@example.com"
          password="ci-$(openssl rand -hex 16)"
          curl -fsS -X POST "${SUPABASE_URL}/auth/v1/admin/users" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\",\"email_confirm\":true}" \
            > /dev/null
          token=$(curl -fsS -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\"}" \
            | jq -r '.access_token // empty')
          if [ -z "${token}" ]; then
            echo "::error::Failed to mint SUPABASE_TEST_USER_JWT — GoTrue admin create or password grant failed."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "SUPABASE_TEST_USER_JWT=${token}" >> "$GITHUB_ENV"
      # Runs `vitest run --config vitest.integration.config.ts` with the JSON
      # reporter (no dotenv wrapper — env comes from the steps above via
      # $GITHUB_ENV). Writes apps/api/integration-results.json for the guard.
      - name: Run apps/api integration suites
        run: pnpm --filter @aeci/api run test:integration:ci
      # Guard against silent exclusion (AECI-90 AC #1). Every spec is wrapped in
      # describe.skipIf(<env unset>); if the DB/keys above were not wired the
      # suites would be COLLECTED but SKIPPED and vitest would still exit 0
      # (numTotalTests>0 yet numPendingTests==33). So fail on 0-collected AND on
      # any pending/skipped test — a green check must mean these security tests
      # actually ran.
      - name: Guard — fail on 0-collected or silently-skipped tests
        run: |
          set -euo pipefail
          results="apps/api/integration-results.json"
          if [ ! -f "${results}" ]; then
            echo "::error::${results} not found — the vitest JSON reporter did not run."
            exit 1
          fi
          total=$(jq '.numTotalTests' "${results}")
          passed=$(jq '.numPassedTests' "${results}")
          pending=$(jq '.numPendingTests' "${results}")
          failed=$(jq '.numFailedTests' "${results}")
          echo "integration totals: total=${total} passed=${passed} pending=${pending} failed=${failed}"
          if [ "${total}" -eq 0 ]; then
            echo "::error::0 integration tests collected — suites were excluded or no specs matched."
            exit 1
          fi
          if [ "${pending}" -gt 0 ]; then
            echo "::error::${pending} integration test(s) were skipped — the DB/Supabase env was not fully wired (describe.skipIf fired). Refusing a green check for un-run security tests."
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
