# AEC Integrations — apps/api live-auth integration suite (AECI-90; pruned AECI-265).
#
# This lane runs the ONE integration spec that survived the Cloudflare-D1 migration
# (PR #359, AECI-248→257): apps/api/src/integration/user-auth.jwks.spec.ts. It is a
# standing regression guard for `requireUserAuth()` — it fetches a Supabase project's
# published signing keys over the network (`createRemoteJWKSet`) and verifies a real,
# freshly-minted access token, asserting issued tokens stay ES256. A dashboard
# signing-key rotation back to HS256 would silently break the production JWKS-only
# verification contract, and this is the only test that exercises that real network
# path (the offline unit spec mocks it).
#
# Auth is the one thing RETAINED on Supabase (ADR 0015 / ADR 0016) — the application DB
# is Cloudflare D1 (no Postgres, no PostgREST, no RLS). The Postgres/PostgREST/RLS suites
# this harness was originally built for were DELETED in PR #359:
#   src/integration/vendor_requests.rls.spec.ts          (PostgREST deny matrix)
#   src/integration/auth_user_delete_trigger.spec.ts     (GDPR delete trigger)
#   src/integration/auth_users_email_read.spec.ts        (privileged email read)
#   src/integration/account_delete.spec.ts               (GDPR erasure)
#   src/integration/airtable-to-supabase-bulk-migrate.spec.ts (idempotent migrate)
#   src/integration/product-counts.spec.ts               (denormalized-count drift)
#   src/integration/backfill-slugs.spec.ts               (slug backfill)
# The planned src/integration/landing_forms.rls.spec.ts was never created, and the
# landing lead-capture tables (feedback/mailing_list) themselves moved to D1 (AECI-257),
# so NOTHING remains on Supabase Postgres — only this Supabase-Auth (GoTrue/JWKS) spec.
# The reviews/profiles authorization deny-matrix is NOT here either: under D1 it is an
# app-layer no-leakage matrix in the UNIT lane —
# apps/api/src/routes/{reviews,profiles}.authz-matrix.spec.ts (AECI-234).
#
# Why local Supabase (not the shared project): booting the stack gives a zero-secret
# GoTrue that both (a) mints a fresh ES256 access token for the spec and (b) serves the
# JWKS endpoint the spec verifies against — no repo secrets, isolated from any shared DB.
# (Prisma / `@prisma/client` were fully removed from apps/api in AECI-278; this lane
# never touched Prisma anyway, so there is no `prisma generate` step here.)
#
# WHEN THIS RUNS (path gate). The spec's outcome depends only on the auth/JWKS source it
# exercises plus the stack that issues the token, so the `paths:` filter below is the
# complete set of inputs:
#   - supabase/config.toml                    stack / auth signing config
#   - apps/api/src/integration/**             the spec itself
#   - apps/api/src/lib/**                      user-auth.ts (imported directly)
#   - apps/api/vitest.integration.config.ts
#   - this workflow file
# A UI-only (apps/web/**), docs, schema/migrations, or unrelated-config PR can't change
# any of these, so it skips entirely and bills nothing.
#
# Backstop: a nightly `schedule:` run (and `workflow_dispatch:`) re-runs the suite
# against a fresh stack on main once a day, catching anything a transitive dependency
# outside the path set might have missed within 24h.
#
# NON-BLOCKING posture is unchanged: this was never in deploy-staging.needs and isn't a
# required check. It reports red/green on PRs that touch the auth/JWKS path.

name: integration-db-tests

on:
  pull_request:
    # No `branches:` (base-branch) filter — mirrors deploy.yml. `branches:` here
    # filters by BASE branch, so pinning it to `main` exempted every PR into
    # `stage-2` / `admin-panel` / an epic branch from this gate. The `paths:`
    # filter below is the real (and only) cost control: a PR that doesn't touch
    # the auth/JWKS input set skips entirely and bills nothing, whatever its base.
    paths:
      - 'supabase/config.toml'
      - 'apps/api/src/integration/**'
      - 'apps/api/src/lib/**'
      - 'apps/api/vitest.integration.config.ts'
      - '.github/workflows/integration-db-tests.yml'
  schedule:
    # Nightly backstop at 07:00 UTC (offset from reconcile-counts' 08:00 UTC).
    - cron: '0 7 * * *'
  workflow_dispatch: {}

# Per-PR concurrency — a fresh push cancels the in-flight stack boot. Scheduled
# runs land on refs/heads/main and won't collide with PR runs.
concurrency:
  group: integration-db-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 default flip;
  # mirrors the other workflows.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  integration-db-tests:
    name: Auth integration suite (live Supabase JWKS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # No `prisma generate` here: the surviving JWKS spec's import graph
      # (lib/user-auth.ts → @aeci/shared / hono / jose) never reached
      # @prisma/client — and Prisma is now fully removed from apps/api (AECI-278).
      - name: Install Supabase CLI
        run: npm install -g supabase@latest
      # `supabase start` boots the FULL stack (Postgres + GoTrue + …). GoTrue must be
      # running because the JWKS spec mints a token via `/auth/v1/admin/*` and verifies
      # it against GoTrue's published JWKS, so a Postgres-only boot (`supabase db start`)
      # would not be enough.
      - name: Boot local Supabase (full stack)
        run: supabase start
      # Remap the local stack's connection details into the env-var names the
      # spec + mint step read (see apps/api/.dev.vars.example). `supabase status
      # -o env` prints KEY="value" lines including API_URL, ANON_KEY,
      # SERVICE_ROLE_KEY — all well-known local values, not secrets.
      - name: Export Supabase connection env
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase-status.env
          # Log only the KEY names (not the local demo values) so a CLI-version
          # change in the output schema is diagnosable.
          echo "supabase status keys: $(cut -d= -f1 /tmp/supabase-status.env | tr '\n' ' ')"
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase-status.env
          set +a
          missing=
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!v:-}" ]; then missing="${missing} ${v}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::supabase status -o env did not provide:${missing} — output keys were: $(cut -d= -f1 /tmp/supabase-status.env | tr '\n' ' ')"
            exit 1
          fi
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      # Mint a fresh authenticated-user JWT for the JWKS spec. Without
      # SUPABASE_TEST_USER_JWT the spec describe.skipIf's itself and the guard
      # step below fails the job. The service-role key creates a confirmed user;
      # the password grant returns that user's access_token (ES256 from the
      # local stack's asymmetric signing keys — exactly what the spec asserts).
      - name: Mint SUPABASE_TEST_USER_JWT
        run: |
          set -euo pipefail
          email="aeci90-ci-$(date +%s)@example.com"
          password="ci-$(openssl rand -hex 16)"
          curl -fsS -X POST "${SUPABASE_URL}/auth/v1/admin/users" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\",\"email_confirm\":true}" \
            > /dev/null
          token=$(curl -fsS -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"${email}\",\"password\":\"${password}\"}" \
            | jq -r '.access_token // empty')
          if [ -z "${token}" ]; then
            echo "::error::Failed to mint SUPABASE_TEST_USER_JWT — GoTrue admin create or password grant failed."
            exit 1
          fi
          echo "::add-mask::${token}"
          echo "SUPABASE_TEST_USER_JWT=${token}" >> "$GITHUB_ENV"
      # Runs `vitest run --config vitest.integration.config.ts` with the JSON
      # reporter (no dotenv wrapper — env comes from the steps above via
      # $GITHUB_ENV). Writes apps/api/integration-results.json for the guard.
      - name: Run apps/api integration suites
        run: pnpm --filter @aeci/api run test:integration:ci
      # Guard against silent exclusion (AECI-90 AC #1). The JWKS spec is wrapped
      # in describe.skipIf(<env unset>); if SUPABASE_URL / the minted JWT above
      # were not wired the spec would be COLLECTED but SKIPPED and vitest would
      # still exit 0 (numTotalTests>0 yet numPendingTests>0). So fail on
      # 0-collected AND on any pending/skipped test — a green check must mean the
      # JWKS regression guard actually ran.
      - name: Guard — fail on 0-collected or silently-skipped tests
        run: |
          set -euo pipefail
          results="apps/api/integration-results.json"
          if [ ! -f "${results}" ]; then
            echo "::error::${results} not found — the vitest JSON reporter did not run."
            exit 1
          fi
          total=$(jq '.numTotalTests' "${results}")
          passed=$(jq '.numPassedTests' "${results}")
          pending=$(jq '.numPendingTests' "${results}")
          failed=$(jq '.numFailedTests' "${results}")
          echo "integration totals: total=${total} passed=${passed} pending=${pending} failed=${failed}"
          if [ "${total}" -eq 0 ]; then
            echo "::error::0 integration tests collected — the suite was excluded or no specs matched."
            exit 1
          fi
          if [ "${pending}" -gt 0 ]; then
            echo "::error::${pending} integration test(s) were skipped — the Supabase env was not fully wired (describe.skipIf fired). Refusing a green check for the un-run JWKS regression guard."
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
