# AEC Integrations — per-PR ephemeral preview deployments (AECI-79, sub-issue
# (d) of AECI-71).
#
# Triggered on `pull_request` for first-party branches only — forks have no
# secrets, so the action would just fail noisily otherwise.
#
# `deploy` job (opened / synchronize / reopened):
#   1. Build the SSR Worker bundle.
#   2. Deploy a per-PR API Worker (`aeci-api-pr-<N>`) via
#      `wrangler deploy --env preview --name aeci-api-pr-<N>` with COMMIT_SHA
#      + DEPLOYED_AT injected per the CLAUDE.md "Version reporting (AECI-74)"
#      pattern. `--name` overrides `env.preview.name` in
#      `apps/api/wrangler.jsonc`.
#   3. (No DATABASE_URL push — the app DB is Cloudflare D1 (ADR 0016), reached
#      via the API Worker's `DB` binding; the Prisma Accelerate runtime path is
#      retired, AECI-253.)
#   4. Rewrite the SSR Worker's static service binding from `aeci-api-preview`
#      to `aeci-api-pr-<N>` so it talks to the matching per-PR API. Wrangler 4
#      has no CLI flag to override service bindings at deploy time, so we sed
#      the JSON in-place on the runner (the local file is discarded with the
#      runner).
#   5. `wrangler deploy --env preview --name aeci-web-pr-<N>` with the same
#      COMMIT_SHA + DEPLOYED_AT vars, giving the SSR Worker its own URL on
#      the `*.aec-integrations.workers.dev` wildcard.
#   6. Smoke-test via /api/version with Cloudflare Access headers; assert the
#      reported `sha` matches the PR head SHA. The endpoint proxies through
#      the service binding so this implicitly validates both the SSR Worker
#      and the per-PR API Worker are wired up. Mirrors the polling loop in
#      refresh-staging.yml.
#   7. Sticky PR comment with the preview URL and a copy-paste curl snippet.
#
# `cleanup` job (closed, merged or not):
#   1. `wrangler delete` both per-PR Workers (API + SSR). Idempotent — the
#      `continue-on-error` flag swallows 404s so a re-opened-then-closed PR
#      whose deploy never succeeded doesn't fail the cleanup.
#   2. Update the sticky comment to "torn down".
#
# DB strategy: the app DB is **Cloudflare D1** (ADR 0016). Per-PR API Workers
# inherit the `env.preview` D1 binding from `apps/api/wrangler.jsonc` — no Prisma
# Accelerate, no DATABASE_URL secret, no per-PR Supabase branches or Management
# API calls. See `docs/environments.md` §"PR previews".
#
# Required GH Actions secrets (all already configured):
#   CLOUDFLARE_API_TOKEN     Scoped per `docs/CICD_PLAN.md` §7.1.
#   CLOUDFLARE_ACCOUNT_ID    e62ec9d8012c3e0c225f8e4dbab76b79.
#   CF_ACCESS_CLIENT_ID      Cloudflare Access service token (`aeci-gh-actions`).
#   CF_ACCESS_CLIENT_SECRET  Same token's secret.
#
# Required GH Actions repo variables: none.

name: pr-preview

# Re-enabled 2026-05-28. (The Prisma Accelerate schema-cache lag that motivated
# the original gating concern is moot under Cloudflare D1 — ADR 0016 / AECI-278;
# the app DB is reached through the Worker's native `DB` binding, not a cached
# HTTPS proxy.) `workflow_dispatch` is retained for manual replays.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Docs-only PRs don't need an ephemeral preview. paths-ignore skips only when
    # EVERY changed file matches; any code file keeps the preview deploy/cleanup
    # running. A pure-docs PR never deploys a preview, so skipping `closed`
    # cleanup for it is a no-op.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Per-PR concurrency. `cancel-in-progress: true` lets a fresh push abort the
# in-flight deploy; the `closed` event arrives as its own run after that and
# won't be cancelled because each closed run lands in a separate (empty)
# queue once the deploy run completes.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Mirrors `deploy.yml` / `refresh-staging.yml`: opt JS-based actions onto
  # Node 24 ahead of the 2026-06-02 default flip.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # PR-scoped Worker names derived from the PR number. Used by both jobs for
  # naming consistency and as the smoke-test hostname.
  API_WORKER_NAME: aeci-api-pr-${{ github.event.pull_request.number }}
  PREVIEW_WORKER_NAME: aeci-web-pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://aeci-web-pr-${{ github.event.pull_request.number }}.aec-integrations.workers.dev

jobs:
  deploy:
    name: Deploy PR preview
    # First-party PRs only. Fork PRs don't receive secrets, so the deploy
    # would fail anyway — skip cleanly instead of red-Xing every external PR.
    if: |
      github.event.action != 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      # ---------------------------------------------------------------------
      # Step 1: Checkout PR head
      # ---------------------------------------------------------------------
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # ---------------------------------------------------------------------
      # Step 2: Install toolchain
      #   pnpm + node + workspace install (the web build transitively bundles
      #   the shared package; the API Worker bundles src/index.ts on the fly).
      # ---------------------------------------------------------------------
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Step 3: Build SSR Worker bundle
      #   The `deploy:preview` package script runs `pnpm run build && wrangler
      #   deploy --env preview`, but wrangler-action bypasses package scripts.
      #   Reproduce the build step here so the bundle exists before deploy.
      # ---------------------------------------------------------------------
      - run: pnpm --filter @aeci/web build

      # ---------------------------------------------------------------------
      # Step 4: Compute the deploy timestamp shared by --var DEPLOYED_AT
      #   AECI-74 contract: ISO-8601 UTC, millisecond precision.
      # ---------------------------------------------------------------------
      - name: Compute deploy timestamp
        id: ts
        run: echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Step 5: Deploy per-PR API Worker
      #   `--name` overrides `env.preview.name` in apps/api/wrangler.jsonc.
      #   Per-PR API + per-PR SSR is what makes /api/version reflect the PR
      #   head SHA (the endpoint proxies via the service binding from SSR
      #   into API, so the API's COMMIT_SHA is what shows up).
      #
      #   No DB connection secret is needed — the app DB is Cloudflare D1 (ADR
      #   0016), reached via the per-PR Worker's `DB` binding inherited from
      #   `env.preview` in apps/api/wrangler.jsonc.
      # ---------------------------------------------------------------------
      - name: Deploy API Worker (preview, PR-scoped)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env preview --name ${{ env.API_WORKER_NAME }} --var COMMIT_SHA:${{ github.event.pull_request.head.sha }} --var DEPLOYED_AT:${{ steps.ts.outputs.deployed_at }}

      # ---------------------------------------------------------------------
      # (No DATABASE_URL push: the app DB is Cloudflare D1 (ADR 0016) reached via
      #  the `DB` binding; the Prisma Accelerate runtime path is retired, AECI-253.)
      # ---------------------------------------------------------------------
      # Step 6b: Push ANTHROPIC_API_KEY to the per-PR API Worker (AECI-258)
      #   Review toxicity scoring (Claude Haiku, lib/toxicity.ts) on POST
      #   /api/reviews. Reuses the staging-tier key and targets the per-PR Worker
      #   by `--name`. Optional + FAIL-OPEN: warn-and-skip when unset — a preview
      #   without the key just stores toxicity_score=null ('Not scored');
      #   submissions still work. Idempotent printf-over-stdin `secret put`.
      # ---------------------------------------------------------------------
      - name: Push ANTHROPIC_API_KEY to per-PR API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY_VALUE: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
        working-directory: apps/api
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY_VALUE" ]; then
            echo "::warning::ANTHROPIC_API_KEY_STAGING not set — skipping push. This preview's review toxicity scoring will no-op (toxicity_score=null) until it is provisioned."
            exit 0
          fi
          printf '%s' "$ANTHROPIC_API_KEY_VALUE" \
            | pnpm exec wrangler secret put ANTHROPIC_API_KEY --name "${API_WORKER_NAME}"

      # ---------------------------------------------------------------------
      # Step 7: Rewrite the SSR service binding to point at the per-PR API
      #   `apps/web/wrangler.jsonc` env.preview.services binds API to the
      #   static name `aeci-api-preview`. Wrangler 4 has no `--service`
      #   override flag at deploy time, so we sed the file on the runner.
      #   The local edit is discarded with the runner; the canonical config
      #   on disk in the repo is untouched.
      #
      #   The sed targets the exact double-quoted occurrence to avoid
      #   accidentally rewriting the same string elsewhere in the file (it
      #   appears in the env.preview.services block only).
      # ---------------------------------------------------------------------
      - name: Rewrite SSR service binding to per-PR API
        run: |
          set -euo pipefail
          sed -i.bak \
            "s/\"aeci-api-preview\"/\"${API_WORKER_NAME}\"/g" \
            apps/web/wrangler.jsonc
          rm -f apps/web/wrangler.jsonc.bak
          # Belt-and-braces: assert the rewrite happened AND no stale ref
          # remains. `grep -c` exits 1 on zero matches under `set -e`, so
          # use explicit `if grep -q` to test instead.
          if grep -q "aeci-api-preview" apps/web/wrangler.jsonc; then
            echo "::error::sed failed: 'aeci-api-preview' still present in apps/web/wrangler.jsonc"
            exit 1
          fi
          if ! grep -q "\"${API_WORKER_NAME}\"" apps/web/wrangler.jsonc; then
            echo "::error::sed failed: new binding '${API_WORKER_NAME}' not present in apps/web/wrangler.jsonc"
            exit 1
          fi
          echo "Service binding rewritten to ${API_WORKER_NAME}"

      # ---------------------------------------------------------------------
      # Step 8: Deploy SSR Worker (PR-scoped name)
      #   `--name` overrides `env.preview.name`; everything else
      #   (workers_dev, service binding now pointing at API_WORKER_NAME, vars,
      #   observability) is inherited from the env.preview block.
      # ---------------------------------------------------------------------
      - name: Deploy SSR Worker (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: pnpm exec wrangler deploy --env preview --name ${{ env.PREVIEW_WORKER_NAME }} --var COMMIT_SHA:${{ github.event.pull_request.head.sha }} --var DEPLOYED_AT:${{ steps.ts.outputs.deployed_at }}

      # ---------------------------------------------------------------------
      # Step 8b: Push SUPABASE_ANON_KEY to the per-PR web Worker (AECI-193)
      #   The preview env's `vars.SUPABASE_URL` is inherited from wrangler.jsonc;
      #   only the anon key is a secret. ADR 0017: every environment uses the
      #   SINGLE shared auth project, so previews push the un-suffixed
      #   SUPABASE_ANON_KEY (same key as staging/demo/prod). Web Worker only —
      #   the API Worker verifies user JWTs with public JWKS material and carries
      #   no Supabase keys. Warn-and-skip while auth is a spike (the SSR auth
      #   surfaces then 503 `auth_not_configured`) — flips to required in 5.5.
      #   Idempotent printf-over-stdin `secret put`.
      # ---------------------------------------------------------------------
      - name: Push SUPABASE_ANON_KEY to per-PR web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY_VALUE: ${{ secrets.SUPABASE_ANON_KEY }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY_VALUE" ]; then
            echo "::warning::SUPABASE_ANON_KEY not set — skipping push. This preview's auth surfaces will return 503 auth_not_configured."
            exit 0
          fi
          printf '%s' "$SUPABASE_ANON_KEY_VALUE" \
            | pnpm exec wrangler secret put SUPABASE_ANON_KEY --name "${PREVIEW_WORKER_NAME}"

      # ---------------------------------------------------------------------
      # Step 8c: Push POSTHOG_KEY to the per-PR web Worker (AECI-239)
      #   The preview env's `vars.POSTHOG_HOST` (US Cloud) is inherited from
      #   wrangler.jsonc; only the project key is a secret. We reuse the staging
      #   value (shared PostHog project) so previews emit window.__AECI_POSTHOG__
      #   and the analytics layer can init (after consent). Web Worker only.
      #   Warn-and-skip: a missing key just no-ops analytics (fail-open). Same
      #   printf-over-stdin idempotent pattern as the SUPABASE push above.
      # ---------------------------------------------------------------------
      - name: Push POSTHOG_KEY to per-PR web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTHOG_KEY_VALUE: ${{ secrets.POSTHOG_KEY_STAGING }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [ -z "$POSTHOG_KEY_VALUE" ]; then
            echo "::warning::POSTHOG_KEY_STAGING not set — skipping push. This preview's PostHog analytics no-ops (no window.__AECI_POSTHOG__)."
            exit 0
          fi
          printf '%s' "$POSTHOG_KEY_VALUE" \
            | pnpm exec wrangler secret put POSTHOG_KEY --name "${PREVIEW_WORKER_NAME}"

      # ---------------------------------------------------------------------
      # Step 8d: Push the Datadog RUM credentials to the per-PR web Worker
      #   (AECI-326). Shared un-suffixed values (single "aeci" app on us5; the
      #   per-env `env` field separates preview from prod). `vars.DD_SITE` is
      #   inherited from wrangler.jsonc. Emits window.__AECI_DD__ so RUM inits and
      #   reports Core Web Vitals. Warn-and-skip: missing creds just no-op RUM
      #   (fail-open). Same printf-over-stdin idempotent pattern as POSTHOG above.
      # ---------------------------------------------------------------------
      - name: Push Datadog RUM credentials to per-PR web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DD_APPLICATION_ID_VALUE: ${{ secrets.DD_APPLICATION_ID }}
          DD_CLIENT_TOKEN_VALUE: ${{ secrets.DD_CLIENT_TOKEN }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          if [ -z "$DD_APPLICATION_ID_VALUE" ] || [ -z "$DD_CLIENT_TOKEN_VALUE" ]; then
            echo "::warning::DD_APPLICATION_ID / DD_CLIENT_TOKEN not set — skipping push. This preview's Datadog RUM no-ops (no window.__AECI_DD__)."
            exit 0
          fi
          printf '%s' "$DD_APPLICATION_ID_VALUE" \
            | pnpm exec wrangler secret put DD_APPLICATION_ID --name "${PREVIEW_WORKER_NAME}"
          printf '%s' "$DD_CLIENT_TOKEN_VALUE" \
            | pnpm exec wrangler secret put DD_CLIENT_TOKEN --name "${PREVIEW_WORKER_NAME}"

      # ---------------------------------------------------------------------
      # Step 9: Verify the preview reports the PR head SHA on BOTH Workers
      #   /api/version (proxied raw to the API Worker) AND /_version (the SSR
      #   Worker's own signal, AECI-92). /api/version alone can't catch a stale
      #   SSR deploy because the SSR Worker forwards it untouched to the API
      #   Worker. Cloudflare Access fronts the wildcard
      #   *.aec-integrations.workers.dev (docs/access.md :42), so
      #   verify-version.sh sends the service-token headers (CF_ACCESS_* below).
      # ---------------------------------------------------------------------
      - name: Verify preview (API + SSR at PR head SHA)
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        # 15 attempts × 6s = 90s budget; fresh workers.dev subdomains can take
        # 30-60s to propagate via DNS the first time. verify-version.sh handles
        # its own curl/jq failures, so the loop just polls on its exit code.
        run: |
          set -uo pipefail
          for attempt in $(seq 1 15); do
            if HOST="$PREVIEW_URL" bash scripts/verify-version.sh; then
              exit 0
            fi
            echo "Attempt $attempt: preview not yet at $EXPECTED_SHA on both Workers. Retrying in 6s..."
            sleep 6
          done
          echo "::error::${PREVIEW_URL} did not report $EXPECTED_SHA on BOTH the API and SSR Workers within 90s"
          # On final failure, capture headers from one more /api/version request
          # and decode the CF Access JWT `meta` param if present.
          # `service_token_status:true` in the decoded payload means the policy
          # accepted the token (and the 302 is for an unrelated reason); `false`
          # means the token was rejected — likely a policy / GH-secrets mismatch
          # (see docs/access.md §5).
          last_headers_file=$(mktemp)
          curl -sS -o /dev/null -D "$last_headers_file" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "${PREVIEW_URL}/api/version" || true
          echo "=== Response headers from final attempt ==="
          cat "$last_headers_file" || true
          location=$(grep -i '^location:' "$last_headers_file" | head -1 | tr -d '\r')
          if [ -n "$location" ]; then
            meta=$(printf '%s' "$location" | sed -n 's/.*meta=\([^&]*\).*/\1/p')
            if [ -n "$meta" ]; then
              echo "=== Decoded CF Access meta JWT payload ==="
              payload=$(printf '%s' "$meta" | cut -d. -f2)
              # base64url -> base64 + pad
              pad=$(( (4 - ${#payload} % 4) % 4 ))
              padded="${payload}$(printf '=%.0s' $(seq 1 "$pad"))"
              printf '%s' "$padded" | tr '_-' '/+' | base64 -d 2>/dev/null | jq . 2>/dev/null || echo "(could not decode payload)"
            fi
          fi
          rm -f "$last_headers_file"
          exit 1

      # ---------------------------------------------------------------------
      # Step 10: Sticky PR comment with the preview URL + curl snippet
      #   `header` keeps subsequent runs editing the same comment instead of
      #   stacking. The Access curl snippet mirrors docs/access.md :139-146.
      # ---------------------------------------------------------------------
      - name: Sticky preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### Preview deployed

            - **URL:** ${{ env.PREVIEW_URL }}
            - **Commit:** `${{ github.event.pull_request.head.sha }}`
            - **Deployed at:** `${{ steps.ts.outputs.deployed_at }}`

            Hit it directly (Cloudflare Access fronts the `*.aec-integrations.workers.dev` wildcard):

            ```bash
            curl \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              ${{ env.PREVIEW_URL }}/api/version
            ```

            Human access uses the OTP-to-email flow in the "AECi Non-Prod" Cloudflare Access app — see `docs/access.md` §1.

            Preview Worker tears down automatically when this PR is closed.

      # ---------------------------------------------------------------------
      # Step 11: Run summary
      # ---------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## pr-preview summary"
            echo
            echo "| metric | value |"
            echo "|---|---|"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| commit SHA | \`${{ github.event.pull_request.head.sha }}\` |"
            echo "| API worker name | \`${{ env.API_WORKER_NAME }}\` |"
            echo "| SSR worker name | \`${{ env.PREVIEW_WORKER_NAME }}\` |"
            echo "| preview URL | ${{ env.PREVIEW_URL }} |"
            echo "| job status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Tear down PR preview
    # Closed (merged or not). First-party only — fork PRs never deployed
    # anything, so there's nothing to delete and no secrets to authenticate.
    if: |
      github.event.action == 'closed'
        && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # ---------------------------------------------------------------------
      # Step 1: Checkout (needed so wrangler-action can read wrangler.jsonc
      # for the account resolution path; `wrangler delete` itself only uses
      # --name + accountId).
      # ---------------------------------------------------------------------
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Step 2: Delete the preview Workers (SSR first, then API)
      #   Order matches the reverse of deploy: tear down the public surface
      #   before the dependency. Both are idempotent — `continue-on-error`
      #   lets a re-opened-then-closed PR (or a closed PR whose deploy never
      #   succeeded) drop through cleanly without masking real errors. The
      #   `delete step outcome` lines in the summary surface any swallowed
      #   404s for inspection.
      #
      #   No DB cleanup: Option 1 means previews share the dev DB; no
      #   per-PR Supabase branch was ever created.
      # ---------------------------------------------------------------------
      - name: Delete SSR preview Worker
        id: delete-web
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/web
        run: pnpm exec wrangler delete --name ${{ env.PREVIEW_WORKER_NAME }} --force

      - name: Delete API preview Worker
        id: delete-api
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/api
        run: pnpm exec wrangler delete --name ${{ env.API_WORKER_NAME }} --force

      # ---------------------------------------------------------------------
      # Step 3: Update sticky comment
      # ---------------------------------------------------------------------
      - name: Sticky preview comment (torn down)
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### Preview torn down

            PR closed — `${{ env.PREVIEW_WORKER_NAME }}` and `${{ env.API_WORKER_NAME }}` have been deleted.

            Re-open this PR to redeploy a fresh preview on the current head SHA.

      # ---------------------------------------------------------------------
      # Step 4: Run summary
      # ---------------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          {
            echo "## pr-preview cleanup summary"
            echo
            echo "| metric | value |"
            echo "|---|---|"
            echo "| PR | #${{ github.event.pull_request.number }} |"
            echo "| SSR worker name | \`${{ env.PREVIEW_WORKER_NAME }}\` |"
            echo "| API worker name | \`${{ env.API_WORKER_NAME }}\` |"
            echo "| delete SSR outcome | ${{ steps.delete-web.outcome }} |"
            echo "| delete API outcome | ${{ steps.delete-api.outcome }} |"
            echo "| job status | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
