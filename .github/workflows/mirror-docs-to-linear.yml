# AEC Integrations: mirror repo docs into Linear Documents (AECI-1549).
#
# docs/linear-docs.json maps each mirrored Markdown file to one Linear Document. This job
# copies the mapped docs into Linear so they are readable outside the repo. The repo file is
# the source of truth. Every run overwrites each Linear Document whole, so edits made in
# Linear are lost on the next merge, and the mirrored header says so.
#
# Logic: scripts/mirror-docs-to-linear.mjs (no dependencies, so no `pnpm install`).
# Adding a doc: `pnpm docs:linear add <path> --title "<title>"` from a workspace, then commit
# the mapping with the doc. Setup and operator commands: docs/CICD_PLAN.md §7.1.
#
# Every run, push or manual, mirrors every mapped doc. It never picks docs by the push's
# diff: the concurrency group below cancels a superseded pending run, and a diff-based run
# after it would skip the cancelled push's doc with nothing going red. A full run also
# repairs any drift left by a failed one.
#
# The job reads no event payload. Its only input is one secret, passed via `env:`.
#
# A failed mirror turns this run RED, and that is the alert. Do not add
# continue-on-error. It is NOT a required check and cannot be one: it runs only after the
# merge, so it never blocks a merge.

name: mirror-docs-to-linear

on:
  push:
    branches: [main]
    # Any Markdown file can be mapped, so any Markdown change starts the job.
    paths:
      - '**.md'
      - 'docs/linear-docs.json'
  workflow_dispatch: {}

# Two merges in quick succession must not race. With cancel-in-progress false, a running
# mirror finishes, and GitHub keeps only the newest pending run. That run mirrors every
# doc from the newest commit, so a cancelled pending run loses nothing.
concurrency:
  group: mirror-docs-to-linear
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  mirror:
    name: Mirror docs to Linear
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Pinned to full commit SHAs: this job holds a write-capable Linear key, so a
      # moved tag must not be able to swap the code that runs next to it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The job never pushes. Do not leave the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      # No pnpm in this job: `@v5` turns package-manager caching on by default
      # from the `packageManager` field, and that lookup needs pnpm on PATH.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Update the Linear Documents
        env:
          # Linear API key, sent as a bare `Authorization` header. Owner and scope:
          # docs/CICD_PLAN.md §7.1. Separate from the production Worker's LINEAR_API_KEY.
          LINEAR_DOCS_MIRROR_API_KEY: ${{ secrets.LINEAR_DOCS_MIRROR_API_KEY }}
        # Unset secret: the script exits 2 with a ::error:: naming it.
        # GITHUB_SHA and the run URL come from the default Actions environment.
        run: node scripts/mirror-docs-to-linear.mjs sync
