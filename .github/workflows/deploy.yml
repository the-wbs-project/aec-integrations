# AEC Integrations — CI pipeline (deploys parked).
#
# Current posture (set 2026-05-18, AECI / no-issue housekeeping):
#   PR push        → lint → typecheck → unit → build         (no deploy)
#   push to main   → lint → typecheck → unit → build         (no deploy)
#
# Rationale:
#   - Per-PR preview deploys (aec-web-pr-<N> / aec-api-pr-<N>) were removed.
#     A future preview model (shared vs. per-PR vs. full staging) is still
#     under investigation; see docs/CICD_PLAN.md §2 deviation callout.
#   - Auto-deploy-to-production on merge to `main` was removed. Production
#     ships manually (`wrangler deploy --env production` from a developer
#     machine) until a deliberate trigger (workflow_dispatch / tag / etc.)
#     is chosen. The `deploy-production` job below is preserved but parked
#     behind `if: false` so re-enabling is a one-line change once a trigger
#     is wired.
#
# Deferred (tracked separately, NOT in this workflow yet):
#   - staging environment (CICD_PLAN §2.2)
#   - E2E / Lighthouse / axe-core jobs (CICD_PLAN §3.1)
#   - Supabase migrations (CICD_PLAN §5)
#   - Datadog deployment markers (CICD_PLAN §9.1)
#   - Smoke tests against deployed URLs (CICD_PLAN §9.2)
#
# Required repo secrets (still configured for the future prod trigger):
#   CLOUDFLARE_API_TOKEN   — scope per CICD_PLAN §7.1
#   CLOUDFLARE_ACCOUNT_ID  — e62ec9d8012c3e0c225f8e4dbab76b79
#
# Required environment: GitHub Settings → Environments → `production`
#   with required reviewers configured (CICD_PLAN §3.3).

name: deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JavaScript-based actions (checkout, setup-node, wrangler-action,
  # download-artifact, pnpm/action-setup) onto Node.js 24. GitHub is forcing
  # this default on 2026-06-02 and removing Node.js 20 from runners on
  # 2026-09-16. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint-and-types:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Prisma client is required for @aeci/api typecheck (src/prisma.ts imports
      # @prisma/client/edge). Generate without env vars — `prisma generate`
      # doesn't connect to the DB.
      - run: pnpm --filter @aeci/api exec prisma generate
      - run: pnpm run lint
      - run: pnpm run typecheck

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # @aeci/api unit tests transitively import @prisma/client/edge via
      # src/routes/health.ts → src/prisma.ts. Generate the client first.
      - run: pnpm --filter @aeci/api exec prisma generate
      - run: pnpm run test:unit

  build-web:
    name: Build SSR Worker
    runs-on: ubuntu-latest
    needs: [lint-and-types, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aeci/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

  deploy-production:
    name: Deploy production
    # PARKED. This job is intentionally never triggered by CI right now.
    # Production ships manually via `wrangler deploy --env production` until
    # a trigger model (workflow_dispatch / tag / promote-from-staging) is
    # chosen. To re-enable: change `if: false` to the chosen condition and
    # add the matching entry to the `on:` block above.
    if: false
    runs-on: ubuntu-latest
    needs: [build-web]
    environment:
      # `production` is configured in repo Settings → Environments with
      # required reviewers. This is the manual approval gate (CICD_PLAN §3.3).
      name: production
      url: https://aecintegrations.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist

      # wrangler-action bypasses the package.json `deploy` script chain,
      # so generate the Prisma client explicitly before bundling.
      - run: pnpm --filter @aeci/api exec prisma generate

      - name: Deploy API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production
          packageManager: pnpm

      - name: Deploy SSR
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --env production
          packageManager: pnpm
