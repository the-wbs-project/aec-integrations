# TEMPORARY (AECI-840). Delete before the PR merges.
#
# The trial the issue asks for: does a GitHub Actions runner get a 200 on the
# listing pages, or do the zone-level bot settings (docs/waf-rate-limits.md §3b)
# challenge it? Three hosts, three rounds each, 5 GETs per round. Read-only.
# Results land in the job summary. It is wired to no gate.
name: aeci-840 ssr-listings trial

on:
  push:
    branches:
      - chris/aeci-840-evaluate-wiring-check-ssr-listingssh-into-the
    paths:
      - .github/workflows/aeci-840-ssr-listings-trial.yml
      - scripts/check-ssr-listings.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Run the probe from a runner
        env:
          ACCESS_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -uo pipefail
          overall=0
          {
            echo "### AECI-840 trial: check-ssr-listings.sh from a GitHub runner"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          for round in 1 2 3; do
            for target in \
                "staging|https://staging.aecintegrations.com|token" \
                "demo|https://demo.aecintegrations.com|token" \
                "production|https://www.aecintegrations.com|none"; do
              IFS='|' read -r name host auth <<<"$target"
              if [ "$auth" = "token" ]; then
                out="$(CF_ACCESS_CLIENT_ID="$ACCESS_ID" CF_ACCESS_CLIENT_SECRET="$ACCESS_SECRET" \
                  bash scripts/check-ssr-listings.sh "$host")"; rc=$?
              else
                out="$(bash scripts/check-ssr-listings.sh "$host")"; rc=$?
              fi
              echo "$out"
              [ "$rc" -eq 0 ] || overall=1
              {
                echo "#### Round $round: $name ($host, Access token: $auth) -> exit $rc"
                echo ""
                echo '```'
                echo "$out" | grep -E '^  (/|PAGE)|^RESULT'
                echo '```'
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
            done
            [ "$round" -eq 3 ] || sleep 30
          done
          exit "$overall"
