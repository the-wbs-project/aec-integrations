# AEC Integrations — post-merge Lighthouse (mobile, error gate — AECI-188).
#
# WHY THIS IS ITS OWN WORKFLOW (moved out of deploy.yml).
#   Lighthouse used to run as a job in deploy.yml on EVERY PR push. It never
#   gated anything there (warn-only at the time, not in deploy-staging
#   `needs:`), so on a PR it was pure noise + ~5 min of CI. This workflow runs
#   it on PUSH TO MAIN ONLY — so it's off PRs entirely and instead reports on
#   the post-merge run, right before/alongside the staging deploy in deploy.yml.
#
#   It can't simply be an `if: push`-gated job back in deploy.yml: that workflow's
#   run-level `concurrency` is `cancel-in-progress: true`, which is correct for
#   DEPLOYS (a rapid second merge should cancel the now-superseded staging deploy)
#   but would also cancel an in-flight Lighthouse run before it reports. Deploys
#   want ref-based cancellation; a Lighthouse report wants to always complete for
#   the exact commit it measured. Opposite needs -> separate workflows.
#
# ENFORCEMENT (AECI-188 partial warn→error flip). `.lighthouserc.cjs` asserts
#   accessibility / best-practices / SEO / TBT / the `/search` TTFB at ERROR
#   level — a miss exits 1 and turns this workflow red (the post-merge alarm).
#   performance / LCP / CLS / the JS budgets stay WARN pending the perf
#   follow-up tracked on the Linear issue referenced in `.lighthouserc.cjs`.
#   Because the gate is post-merge, a red here means MAIN already regressed:
#   treat it like a failed deploy gate — fix forward or revert, don't ignore it.
#   N=3 runs (LHCI_RUNS below) give a median-run aggregation so the error gate
#   doesn't flake on a single noisy run.
#
# CONCURRENCY. Per-COMMIT group, never cancelled: every merged commit gets its
#   own Lighthouse run that always finishes, fully decoupled from deploy.yml's
#   cancellation. (A shared group + cancel-in-progress:false would drop the
#   intermediate commit when several merges land in a row — GitHub keeps only the
#   running + newest-pending run and cancels the rest. Per-SHA avoids that.)
#
# SELF-CONTAINED. Unlike the old job it can't `needs:` build-web / download that
#   workflow's `web-dist` artifact (artifacts don't cross workflow runs), so it
#   builds the SSR Worker itself and boots `dev:bound` exactly like the old job.
#   The Phase 2 detail/browse fixtures it measures come from the LOCAL D1
#   (`aeci-app-preview`), seeded by `dev:bound`'s `db:setup:local` →
#   `db:seed:fixtures:local` (apps/api/seed/phase2-fixtures.sql) — post-D1 cutover
#   (ADR 0016) the API Worker reads D1, not Supabase, so there is no longer a
#   shared-dev-DB fixture seed to depend on (AECI-268). NOTE (error gate): if that
#   local D1 seed fails, detail URLs render the 404 shell and the error-level
#   SEO/a11y assertions go red — that is a deliberate alarm, not a flake; re-run.
#   (No DATABASE_URL wiring — the measured pages read the local D1 the Worker
#   boots via `db:setup:local`; the Prisma Accelerate path is retired, AECI-253.)
#
# Chrome comes from the ubuntu-latest runner image (lhci/chrome-launcher finds
#   /usr/bin/google-chrome) — no Playwright/Chromium install needed, matching the
#   former job.
#
# Required repo secrets:
#   - ALGOLIA_APP_ID + ALGOLIA_SEARCH_KEY — the single shared client-exposed,
#     query-only search key (AECI-188; must be able to query the preview_*
#     indexes this run measures against). Without it `/search`
#     renders the degraded "search unavailable" shell, the InstantSearch SDK
#     never loads, and the /search JS budget + a11y numbers measure a page that
#     doesn't exist in production. The preview_* indexes it queries are created/
#     populated by `pnpm algolia:bulk-sync -- --env preview` (read-only here).

name: lighthouse

on:
  push:
    branches: [main]
    # Docs-only merges can't move perf — skip them (matches deploy.yml).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # Manual run on any branch (AECI-221). The gate is otherwise post-merge-only,
  # so there is no pre-merge signal; `workflow_dispatch` lets a perf-affecting
  # branch be measured against the real CI conditions (N=3 median, no Datadog,
  # the shared dev DB at HEAD) BEFORE it lands — so a warn→error flip can be
  # validated rather than merged on faith. Reads the same repo secrets.
  workflow_dispatch:

# Per-commit group so each merged SHA gets an uncancelled report, independent of
# deploy.yml's run-level (ref-based, cancel-in-progress) concurrency.
concurrency:
  group: lighthouse-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lighthouse:
    name: Lighthouse CI (mobile, error gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Build the SSR Worker here (no cross-workflow artifact to reuse).
      # `dev:preview` serves the prebuilt dist/ via `wrangler dev` — it does NOT
      # build — so the bundle must exist before dev:bound boots.
      - run: pnpm --filter @aeci/web build
      # No DATABASE_URL wiring: the app DB is local D1 (ADR 0016) — dev:bound runs
      # `db:setup:local` to migrate + seed it, and the Prisma Accelerate runtime
      # path is retired (AECI-253). The measured pages read D1 via the `DB` binding.
      # Wire the preview Algolia search key into the SSR Worker so `/search`
      # boots the REAL InstantSearch SDK (AECI-188): the JS budget + a11y
      # assertions on /search are meaningless against the degraded shell.
      #
      # Also overlay ALLOW_INDEXING=true. The `preview` env is fail-closed
      # noindex (AECI-303: it stamps `X-Robots-Tag: noindex, nofollow` on every
      # non-/api/* response), which fails Lighthouse's `is-crawlable` audit and
      # drags `categories:seo` to ~0.63 on EVERY indexable URL — turning the
      # AECI-188 error-level SEO gate permanently red by design. The SEO gate is
      # meant to measure the LAUNCH posture (crawlable + titled + described), so
      # we overlay the indexable state here exactly as we overlay the real
      # Algolia key. This is CI-measurement-only and changes no deployed env
      # (those keep ALLOW_INDEXING=false until public launch). `/search` and the
      # 404 stay SEO-exempt either way: their noindex comes from in-page
      # `<meta robots>`, not this egress header.
      #
      # `.dev.vars` overlays wrangler.jsonc vars PER-KEY, so writing only these
      # keys preserves `ENV=preview` (and with it the preview_* index names)
      # from apps/web/wrangler.jsonc.
      - name: Write apps/web/.dev.vars (Algolia search key + indexing gate)
        env:
          ALGOLIA_APP_ID_VALUE: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_KEY_VALUE: ${{ secrets.ALGOLIA_SEARCH_KEY }}
        run: |
          if [ -z "$ALGOLIA_APP_ID_VALUE" ] || [ -z "$ALGOLIA_SEARCH_KEY_VALUE" ]; then
            echo "::error::ALGOLIA_APP_ID / ALGOLIA_SEARCH_KEY secret is empty. The /search Lighthouse budgets must measure the real InstantSearch SDK, not the degraded shell. Seed it from the shared search-only key (scripts/algolia/provision.mjs prints the gh secret command; the key is client-exposed/query-only by design and must cover the preview_* indexes)."
            exit 1
          fi
          {
            printf 'ALGOLIA_APP_ID="%s"\n' "$ALGOLIA_APP_ID_VALUE"
            printf 'ALGOLIA_SEARCH_KEY="%s"\n' "$ALGOLIA_SEARCH_KEY_VALUE"
            printf 'ALLOW_INDEXING="true"\n'
          } > apps/web/.dev.vars
      - name: Boot dev:bound (API + SSR) and wait for /api/health
        run: |
          nohup pnpm dev:bound > dev-bound.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS -o /dev/null --max-time 2 http://localhost:8788/api/health; then
              echo "dev:bound healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::dev:bound did not become healthy on :8788 within 90s"; tail -200 dev-bound.log; exit 1
      # Guard: /search must serve the real Algolia config, or every /search
      # number below is measured against the degraded shell (see the .dev.vars
      # step above — this catches a regression in the SSR injection itself).
      - name: Assert /search serves the InstantSearch config
        run: |
          # Capture the body first: `curl … | grep -q` is unsafe under the
          # default `bash -eo pipefail` — grep -q closes the pipe on first match
          # (the token sits near the top of <head>), so on a >64 KB SSR document
          # curl is still writing and exits non-zero (EPIPE), which pipefail then
          # propagates as a spurious guard failure.
          search_html="$(curl -fsS http://localhost:8788/search)"
          if ! grep -q '__AECI_ALGOLIA__' <<<"$search_html"; then
            echo "::error::/search did not render window.__AECI_ALGOLIA__ — the SSR Worker is not injecting the Algolia search config, so Lighthouse would measure the degraded shell."
            exit 1
          fi
      # AECI_LHCI_URL intentionally UNSET → .lighthouserc.cjs targets :8788.
      # LHCI_RUNS=3 restores the median-run aggregation the error gate needs
      # (the rc defaults to a single run for quick local passes).
      - name: Lighthouse CI (error gate, mobile)
        env:
          LHCI_RUNS: '3'
        run: pnpm lighthouse
      - name: dev:bound logs on failure
        if: failure()
        run: tail -200 dev-bound.log || true
