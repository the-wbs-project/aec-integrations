# AEC Integrations — PR-time schema-drift detection (AECI-264).
#
# Asserts that the committed Drizzle/D1 migrations are in sync with the schema
# source of truth. The app database is Cloudflare D1 + Drizzle (ADR 0016 /
# AECI-248→257): the schema is authored in `apps/api/src/db/schema.ts` and
# migration SQL is generated by drizzle-kit into `apps/api/migrations/`.
#
# How it works:
#   - Path-filtered. Only fires on PRs that touch the schema, the drizzle-kit
#     config, the generated migrations, or this workflow file. Most PRs skip it.
#   - Runs `pnpm --filter @aeci/api db:generate` (drizzle-kit generate). If
#     `schema.ts` matches the latest snapshot, drizzle-kit writes nothing and the
#     working tree stays clean → pass. If `schema.ts` drifted, drizzle-kit emits a
#     new `NNNN_*.sql` + updates `meta/_journal.json` + a snapshot → the tree goes
#     dirty → fail. We check `git status --porcelain` (not `git diff`) so brand-new,
#     untracked migration files are caught too.
#   - No database is booted: drizzle-kit `generate` reads the TS schema and writes
#     SQL files; it needs no D1/SQLite connection (config has no dbCredentials).
#
# How developers fix a failing drift check:
#   1. Pull the branch locally.
#   2. `pnpm --filter @aeci/api db:generate`.
#   3. Commit the new files under `apps/api/migrations/` (including `meta/`).
#   4. Push. The drift-check job re-runs and passes.
#
# Scope note: this guards the D1 app schema — the only app-schema drift gate.
# The former Supabase-Postgres schema/RLS drift gate (`scripts/prisma-drift-check.sh`
# + `scripts/verify-rls.sql`) was removed with the Prisma/Postgres-app-DB
# decommission (AECI-278); Supabase is now Auth-only and the app schema lives
# solely in D1. The sibling DATA-drift guard for the D1 product aggregates is
# `reconcile-counts.yml`.

name: drift-check

on:
  pull_request:
    paths:
      - 'apps/api/src/db/schema.ts'
      - 'apps/api/drizzle.config.ts'
      - 'apps/api/migrations/**'
      - '.github/workflows/drift-check.yml'

# Cancel superseded runs when a PR is force-pushed; the latest commit is the
# one we care about.
concurrency:
  group: drift-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.0'
  # Opt JS-based actions onto Node 24 ahead of the 2026-06-02 default flip;
  # mirrors `.github/workflows/refresh-staging.yml` and `deploy.yml`.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  drift:
    name: Schema vs migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        run: npm install -g pnpm@${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Regenerate migrations from `schema.ts`. `</dev/null` so an ambiguous
      # column/table rename (the only case drizzle-kit prompts) errors out
      # immediately instead of hanging until the job timeout — an interactive
      # prompt means there IS drift, which we want to fail on regardless.
      - name: Drift check (schema.ts vs apps/api/migrations)
        run: |
          pnpm --filter @aeci/api db:generate </dev/null
          if [ -n "$(git status --porcelain -- apps/api/migrations)" ]; then
            echo "::error::Schema drift: apps/api/src/db/schema.ts has changes not captured in apps/api/migrations/."
            git status --porcelain -- apps/api/migrations
            git --no-pager diff -- apps/api/migrations
            exit 1
          fi
          echo "✓ No schema drift — apps/api/src/db/schema.ts matches apps/api/migrations/."

      # Surface a readable fix hint when the check fails. `if: failure()` ensures
      # this only runs when the previous step exited non-zero — it adds context,
      # it does not override the failure.
      - name: Explain drift on failure
        if: failure()
        run: |
          {
            echo "::error::Schema drift detected between apps/api/src/db/schema.ts and apps/api/migrations/."
            echo "::error::To fix locally:"
            echo "::error::  1. pnpm --filter @aeci/api db:generate   # drizzle-kit writes the new migration SQL + snapshot"
            echo "::error::  2. commit the new apps/api/migrations/* files (including meta/)"
            echo "::error::  3. push"
          }
