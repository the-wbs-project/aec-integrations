<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prisma mailing list test</title>
    <style>
      :root {
        color-scheme: light;
        --forest: #1e3a2f;
        --bone: #f5f2ea;
        --bone-600: #ede9de;
        --ink: #0f1419;
        --stone: #6b6b63;
        --clay: #e89668;
        --white: #ffffff;
        --border: color-mix(in srgb, var(--forest) 18%, transparent);
        --danger: #9f2d20;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bone);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      button,
      input {
        font: inherit;
      }

      button {
        min-height: 40px;
        border: 0.5px solid var(--forest);
        background: var(--forest);
        color: var(--bone);
        cursor: pointer;
        padding: 0 16px;
      }

      button.secondary {
        background: transparent;
        color: var(--forest);
      }

      button.danger {
        border-color: var(--danger);
        background: transparent;
        color: var(--danger);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      input {
        min-height: 40px;
        width: 100%;
        border: 0.5px solid var(--border);
        background: var(--white);
        color: var(--ink);
        padding: 8px 10px;
      }

      input:focus,
      button:focus-visible {
        outline: 2px solid var(--clay);
        outline-offset: 2px;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 44px 0 56px;
      }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        border-bottom: 0.5px solid var(--border);
        padding-bottom: 28px;
      }

      h1 {
        margin: 0;
        color: var(--forest);
        font-size: clamp(2rem, 5vw, 4.5rem);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 0.96;
      }

      .subhead {
        max-width: 680px;
        margin: 18px 0 0;
        color: var(--stone);
      }

      .status {
        min-height: 32px;
        color: var(--forest);
        font-size: 0.95rem;
        text-align: right;
      }

      .status.error {
        color: var(--danger);
      }

      .panel {
        margin-top: 32px;
        border: 0.5px solid var(--border);
        background: var(--white);
      }

      .form-grid {
        display: grid;
        grid-template-columns: minmax(220px, 1.4fr) repeat(3, minmax(140px, 1fr)) auto;
        gap: 12px;
        padding: 16px;
        background: var(--bone-600);
        border-bottom: 0.5px solid var(--border);
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--stone);
        font-size: 0.78rem;
      }

      label span {
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 880px;
      }

      th,
      td {
        border-bottom: 0.5px solid var(--border);
        padding: 13px 14px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--forest);
        font-size: 0.78rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      td {
        color: var(--ink);
        font-size: 0.95rem;
      }

      td.muted {
        color: var(--stone);
      }

      td.actions {
        white-space: nowrap;
        text-align: right;
      }

      .actions button + button {
        margin-left: 8px;
      }

      .empty {
        padding: 42px 16px;
        color: var(--stone);
        text-align: center;
      }

      .edit-row input {
        min-width: 120px;
      }

      @media (max-width: 860px) {
        .shell {
          width: min(100% - 24px, 720px);
          padding-top: 28px;
        }

        .masthead,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .status {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div>
          <h1>Prisma mailing list test</h1>
          <p class="subhead">
            CRUD against the <code>mailing_list</code> table through Prisma
            Accelerate from a Cloudflare Worker.
          </p>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </header>

      <section class="panel" aria-label="Mailing list rows">
        <form id="create-form" class="form-grid">
          <label>
            <span>Email</span>
            <input name="email" type="email" required autocomplete="off" />
          </label>
          <label>
            <span>Country</span>
            <input name="country" autocomplete="off" />
          </label>
          <label>
            <span>City</span>
            <input name="city" autocomplete="off" />
          </label>
          <label>
            <span>Region</span>
            <input name="region" autocomplete="off" />
          </label>
          <button type="submit">Create row</button>
        </form>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Country</th>
                <th>City</th>
                <th>Region</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="empty" hidden>No rows returned.</div>
      </section>
    </main>

    <script>
      const rowsEl = document.querySelector("#rows");
      const emptyEl = document.querySelector("#empty");
      const statusEl = document.querySelector("#status");
      const formEl = document.querySelector("#create-form");
      let rows = [];
      let editingId = null;

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", isError);
      }

      async function api(path, options = {}) {
        const response = await fetch(path, {
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
          ...options,
        });
        const payload = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(payload.error || "Request failed");
        }

        return payload;
      }

      function field(value) {
        return value || "";
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (character) => {
          const replacements = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          };
          return replacements[character];
        });
      }

      function text(value) {
        return value ? value : "NULL";
      }

      function createdAt(value) {
        return value ? new Date(value).toLocaleString() : "";
      }

      function render() {
        emptyEl.hidden = rows.length > 0;
        rowsEl.innerHTML = "";

        for (const row of rows) {
          rowsEl.append(editingId === row.id ? editRow(row) : readRow(row));
        }
      }

      function readRow(row) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="muted">${escapeHtml(row.id)}</td>
          <td>${escapeHtml(row.email)}</td>
          <td class="muted">${escapeHtml(text(row.country))}</td>
          <td class="muted">${escapeHtml(text(row.city))}</td>
          <td class="muted">${escapeHtml(text(row.region))}</td>
          <td class="muted">${escapeHtml(createdAt(row.createdAt))}</td>
          <td class="actions">
            <button class="secondary" type="button" data-action="edit">Edit</button>
            <button class="danger" type="button" data-action="delete">Delete</button>
          </td>
        `;
        tr.querySelector('[data-action="edit"]').addEventListener("click", () => {
          editingId = row.id;
          render();
        });
        tr.querySelector('[data-action="delete"]').addEventListener("click", () =>
          deleteRow(row.id),
        );
        return tr;
      }

      function editRow(row) {
        const tr = document.createElement("tr");
        tr.className = "edit-row";
        tr.innerHTML = `
          <td class="muted">${escapeHtml(row.id)}</td>
          <td><input name="email" type="email" required value="${escapeHtml(field(row.email))}" /></td>
          <td><input name="country" value="${escapeHtml(field(row.country))}" /></td>
          <td><input name="city" value="${escapeHtml(field(row.city))}" /></td>
          <td><input name="region" value="${escapeHtml(field(row.region))}" /></td>
          <td class="muted">${escapeHtml(createdAt(row.createdAt))}</td>
          <td class="actions">
            <button type="button" data-action="save">Save</button>
            <button class="secondary" type="button" data-action="cancel">Cancel</button>
          </td>
        `;
        tr.querySelector('[data-action="save"]').addEventListener("click", () => {
          const data = Object.fromEntries(
            Array.from(tr.querySelectorAll("input")).map((input) => [
              input.name,
              input.value,
            ]),
          );
          updateRow(row.id, data);
        });
        tr.querySelector('[data-action="cancel"]').addEventListener("click", () => {
          editingId = null;
          render();
        });
        return tr;
      }

      async function loadRows() {
        setStatus("Loading rows...");
        try {
          const payload = await api("/api/rows");
          rows = payload.rows || [];
          render();
          setStatus(`${rows.length} rows loaded`);
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function createRow(event) {
        event.preventDefault();
        const submit = formEl.querySelector('button[type="submit"]');
        submit.disabled = true;
        setStatus("Creating row...");

        try {
          const data = Object.fromEntries(new FormData(formEl).entries());
          const payload = await api("/api/rows", {
            method: "POST",
            body: JSON.stringify(data),
          });
          rows = [payload.row, ...rows.filter((row) => row.id !== payload.row.id)];
          formEl.reset();
          render();
          setStatus("Row created");
        } catch (error) {
          setStatus(error.message, true);
        } finally {
          submit.disabled = false;
        }
      }

      async function updateRow(id, data) {
        setStatus("Saving row...");

        try {
          const payload = await api(`/api/rows/${id}`, {
            method: "PATCH",
            body: JSON.stringify(data),
          });
          rows = rows.map((row) => (row.id === id ? payload.row : row));
          editingId = null;
          render();
          setStatus("Row saved");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function deleteRow(id) {
        if (!confirm("Delete this row?")) {
          return;
        }

        setStatus("Deleting row...");

        try {
          await api(`/api/rows/${id}`, { method: "DELETE" });
          rows = rows.filter((row) => row.id !== id);
          render();
          setStatus("Row deleted");
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      formEl.addEventListener("submit", createRow);
      loadRows();
    </script>
  </body>
</html>
